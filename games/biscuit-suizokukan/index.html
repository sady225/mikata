<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ビスケットすいぞくかん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a2d52;overflow:hidden;overscroll-behavior:none}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:#fff}
#root{height:100%}
.app{position:relative;width:min(100vw,calc(100vh*0.62));width:min(100vw,calc(100dvh*0.62));height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#32b6f0;user-select:none;-webkit-user-select:none;touch-action:none}
.cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font-family:inherit;cursor:pointer;border:0}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;height:122px;background:#E60012;padding:8px 14px 0;pointer-events:none}
.wave{position:absolute;left:0;right:0;top:121px;height:12px;pointer-events:none;background:radial-gradient(circle at 12px 0,#E60012 11px,transparent 12px) repeat-x;background-size:24px 12px}
.row1{display:flex;justify-content:space-between;align-items:flex-start}
.lbl{font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.9}
.score{font-size:38px;line-height:1;font-weight:900;color:#FFE35C;text-shadow:0 3px 0 #a8000f;font-variant-numeric:tabular-nums}
.best{font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
.nextBox{display:flex;align-items:center;gap:8px}
.bubble{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 0 #a8000f}
.bubble::after{content:"";position:absolute;left:-4px;bottom:6px;border:8px solid transparent;border-right-color:#fff;border-left:0;transform:rotate(-20deg)}
.bubble img{display:block;max-width:46px;animation:bob 1.6s ease-in-out infinite}
.evo{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:5px 8px;background:rgba(0,0,0,.18);border-radius:16px}
.evo img{width:29px;height:29px;transition:all .4s}
.evo img.off{filter:brightness(0) opacity(.35)}
.evo img.on{filter:none;animation:bob 2.4s ease-in-out infinite}
.evo img:nth-child(2n).on{animation-delay:.3s}

/* 下のバー */
.bar{position:absolute;left:0;right:0;bottom:0;height:92px;padding:6px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:center}
.btn{position:relative;flex:1;height:58px;border-radius:29px;background:#fff;color:#E60012;font-weight:900;font-size:16px;box-shadow:0 4px 0 #1a76c8,0 0 0 3px #FFE35C inset;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1a76c8,0 0 0 3px #FFE35C inset}
.btn:disabled{opacity:.5;filter:grayscale(.4)}
.btn.small{flex:.62;font-size:13px}
.btn.active{background:#FFE35C;color:#b8000f}
.btn .sub{font-size:10px;opacity:.8}
.badge{position:absolute;top:-8px;right:-4px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#1a76c8;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

/* ヒント吹き出し */
.hint{position:absolute;left:0;right:0;top:46%;display:flex;justify-content:center;pointer-events:none;animation:hintin .5s ease both}
.speech{position:relative;background:#fff;color:#0d4f9c;font-weight:700;font-size:15px;line-height:1.55;text-align:center;padding:12px 18px;border-radius:26px;box-shadow:0 4px 0 rgba(10,80,150,.25)}
.speech b{color:#E60012}
.speech::after{content:"";position:absolute;left:34px;bottom:-14px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}

/* タイトル */
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(8,70,140,.5),rgba(8,70,140,.05) 38%,rgba(8,70,140,.05) 60%,rgba(8,70,140,.55));pointer-events:none}
.titleTop{padding-top:calc(34px + env(safe-area-inset-top));text-align:center}
.chip{display:inline-block;background:#E60012;color:#fff;font-weight:900;font-size:13px;padding:6px 16px;border-radius:20px;box-shadow:0 3px 0 #a8000f;margin-bottom:14px}
.logo{margin:0;font-weight:900;line-height:1.05;transform:rotate(-5deg)}
.ln{position:relative;display:block;isolation:isolate;color:#FFE35C;letter-spacing:.02em;text-shadow:0 6px 0 rgba(20,90,170,.55)}
.ln::before,.ln::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;text-shadow:none}
.ln::before{-webkit-text-stroke:20px #fff;z-index:-2;color:#fff}
.ln::after{-webkit-text-stroke:11px #E60012;z-index:-1;color:#E60012}
.ln.a{font-size:min(17vw,86px)}
.ln.b{font-size:min(14vw,70px)}
.titleBot{padding:0 20px calc(26px + env(safe-area-inset-bottom));text-align:center;pointer-events:none}
.parade{display:flex;justify-content:center;gap:2px;margin-bottom:14px}
.parade img{width:min(9.4vw,38px);animation:bob 1.8s ease-in-out infinite}
.play{pointer-events:auto;display:block;margin:0 auto;width:78%;max-width:320px;height:70px;border-radius:35px;background:#E60012;color:#fff;font-size:30px;font-weight:900;letter-spacing:.2em;box-shadow:0 6px 0 #a8000f,0 0 0 5px #FFE35C;animation:pulse 1.6s ease-in-out infinite}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #a8000f,0 0 0 5px #FFE35C}
.play.sm{height:58px;font-size:22px;letter-spacing:.1em;width:100%;max-width:none;animation:none;margin-top:14px}
.howto{display:flex;flex-direction:column;gap:3px;margin-top:20px;font-size:14px;font-weight:700;text-shadow:0 2px 0 rgba(10,70,140,.7)}
.howto b{color:#FFE35C}
.bestLine{margin-top:10px;font-size:13px;font-weight:700;text-shadow:0 2px 0 rgba(10,70,140,.7)}

/* モーダル */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,50,100,.55);padding:24px;animation:fade .3s ease both}
.modal.clear{background:rgba(6,50,100,.35)}
.card{width:100%;max-width:340px;background:#fff;color:#0d4f9c;border-radius:30px;padding:22px 22px 20px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18),0 0 0 6px #E60012;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.cardTitle{font-size:22px;white-space:nowrap;font-weight:900;color:#E60012}
.big{width:112px;height:112px;margin:8px auto 0;display:block}
.floaty{animation:bob 1.6s ease-in-out infinite}
.cardLine{font-size:15px;font-weight:700;margin-top:6px}
.cardLine b{color:#E60012}
.cardScore{font-size:48px;font-weight:900;color:#E60012;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.cardScore small{font-size:16px;margin-left:4px;color:#0d4f9c}
.nb{margin-top:6px;display:inline-block;background:#FFE35C;color:#b8000f;font-weight:900;font-size:14px;padding:4px 14px;border-radius:14px}
.ghost{margin-top:10px;background:transparent;color:#1a76c8;font-weight:900;font-size:15px;padding:8px 16px}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes hintin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>

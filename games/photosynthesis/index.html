<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d6f8e">
<title>光合成ラボ！ O₂チャレンジ — 子どものMIKATA</title>
<style>
:root{--red:#e60012;--yellow:#ffe35c;--blue:#1a76c8;--deep:#0d4f9c;--water:#39bdf2;--green:#46b96f;--ink:#123c55;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#082e52}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#fff}
button{font:inherit;border:0;cursor:pointer}
#app{position:relative;width:min(100vw,calc(100dvh*.62));height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#35b9f0 0 18%,#72d7ef 18% 66%,#1596d5 66%);user-select:none;touch-action:none}
.hud{position:absolute;z-index:30;left:0;right:0;top:0;height:126px;background:var(--red);padding:8px 12px 0;box-shadow:0 4px #aa0010}
.wave{position:absolute;left:0;right:0;top:124px;height:12px;background:radial-gradient(circle at 12px 0,var(--red) 11px,transparent 12px) repeat-x;background-size:24px 12px}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.lbl{font-size:10px;font-weight:900;letter-spacing:.12em}.score{font-size:38px;font-weight:1000;color:var(--yellow);line-height:1;text-shadow:0 3px #a8000f;font-variant-numeric:tabular-nums}.best{font-size:11px;font-weight:900;margin-top:2px}.nextBox{display:flex;gap:7px;align-items:center}.nextBubble{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;box-shadow:0 3px #a8000f;font-size:28px;position:relative}.nextBubble:after{content:"";position:absolute;left:-5px;bottom:6px;border:8px solid transparent;border-right-color:#fff;border-left:0;transform:rotate(-20deg)}.nextText{font-size:10px;font-weight:900;line-height:1.3}.nextText b{font-size:15px;color:var(--yellow)}
.evo{display:flex;align-items:center;justify-content:space-between;margin-top:7px;padding:5px 7px;background:rgba(0,0,0,.16);border-radius:16px}.evoItem{font-size:24px;filter:brightness(.25) opacity(.4);transition:.25s;position:relative}.evoItem.on{filter:none;animation:bob 1.7s ease-in-out infinite}.evoItem.cur:after{content:"★";position:absolute;right:-6px;top:-5px;color:var(--yellow);font-size:11px}
.stage{position:absolute;inset:136px 0 92px;overflow:hidden}
.sun{position:absolute;left:23px;top:32px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff7b0 0 12%,#ffe16a 33%,#ffbd32 100%);box-shadow:0 0 var(--sunGlow,22px) #ffe16acc;transform:scale(var(--sunScale,1));transition:transform .18s,box-shadow .18s;transform-origin:center}.sun.feedFlash{animation:sunPop .28s ease-out}.ray{position:absolute;left:62px;top:69px;width:165px;height:230px;clip-path:polygon(0 0,100% 16%,78% 100%,18% 88%);background:linear-gradient(100deg,rgba(255,235,105,var(--rayOpacity,.55)),rgba(255,226,93,0));filter:drop-shadow(0 0 8px #ffe16a55);transition:opacity .16s,width .16s;opacity:var(--rayOpacity,.55)}
@keyframes sunPop{50%{transform:scale(calc(var(--sunScale,1) + .16))}}
.co2Bottle{position:absolute;left:8px;bottom:52px;width:52px;height:105px;z-index:7}.co2Body{position:absolute;left:6px;bottom:0;width:40px;height:78px;border-radius:12px 12px 16px 16px;background:linear-gradient(90deg,#9aa8ad,#e7eef0 45%,#84969d);border:3px solid #52656c;box-shadow:0 5px #0a4b6650}.co2Body:after{content:"CO₂";position:absolute;left:4px;right:4px;top:28px;background:#fff;color:#285c68;border-radius:7px;text-align:center;font-size:11px;font-weight:1000;padding:2px}.co2Valve{position:absolute;left:17px;top:7px;width:18px;height:22px;background:#5d6d73;border-radius:5px}.co2Knob{position:absolute;left:10px;top:0;width:32px;height:9px;border-radius:6px;background:#e60012}.hose{position:absolute;z-index:6;left:47px;bottom:119px;width:83px;height:73px;border-left:5px solid #4c5c63;border-bottom:5px solid #4c5c63;border-radius:0 0 0 18px;transform:rotate(-8deg);transform-origin:left bottom}.hose:after{content:"";position:absolute;right:-5px;bottom:-6px;width:10px;height:10px;border-radius:50%;background:#4c5c63}.co2Bottle.puff .co2Knob{animation:knob .22s ease-out}.co2Bottle.puff .co2Body{animation:bottle .22s ease-out}@keyframes knob{50%{transform:rotate(18deg) scale(1.12)}}@keyframes bottle{50%{transform:translateY(-3px)}}
.tank{position:absolute;left:72px;right:26px;bottom:26px;height:72%;border:6px solid #d7f7ff;border-top:0;border-radius:0 0 22px 22px;background:#dff8ff55;overflow:hidden;box-shadow:inset 0 -18px 26px #0d79a722}.waterFill{position:absolute;left:0;right:0;bottom:0;height:var(--waterHeight,62%);background:linear-gradient(#9deaf2aa,#49bed7cc);transition:height .18s}.waterline{position:absolute;left:0;right:0;top:0;height:4px;background:#fff9;box-shadow:0 2px #48afc5}
.co2Stream{position:absolute;left:13%;bottom:8%;width:28px;height:62%;z-index:4;pointer-events:none;opacity:.35;transition:opacity .15s}.co2Dot{position:absolute;bottom:0;width:7px;height:7px;border:2px solid #e9fcff;border-radius:50%;animation:co2rise 1.35s linear infinite}.co2Dot:nth-child(2){left:10px;animation-delay:.28s}.co2Dot:nth-child(3){left:3px;animation-delay:.58s}.co2Dot:nth-child(4){left:15px;animation-delay:.82s}.co2Stream.burst{opacity:1;filter:drop-shadow(0 0 4px #fff)}@keyframes co2rise{0%{transform:translateY(0) scale(.7);opacity:.3}30%{opacity:1}100%{transform:translateY(-125px) translateX(6px) scale(1.2);opacity:0}}
.plantWrap{position:absolute;z-index:5;left:50%;bottom:0;width:65%;height:88%;transform:translateX(-50%);transition:.3s}.stem{position:absolute;left:50%;bottom:4%;width:9px;height:72%;background:#398f57;border-radius:10px;transform:translateX(-50%)}.leaf{position:absolute;width:42%;height:16%;background:linear-gradient(135deg,#62cf82,#268a50);border-radius:100% 0 100% 0}.a{left:50%;bottom:22%;transform:rotate(-28deg)}.b{left:10%;bottom:36%;transform:scaleX(-1) rotate(-22deg)}.c{left:50%;bottom:50%;transform:rotate(-20deg)}.d{left:10%;bottom:64%;transform:scaleX(-1) rotate(-15deg)}.e{left:50%;bottom:76%;transform:rotate(-8deg)}.extra{display:none}.lv2 .extra.e1,.lv3 .extra.e1,.lv4 .extra.e1,.lv5 .extra.e1,.lv3 .extra.e2,.lv4 .extra.e2,.lv5 .extra.e2,.lv4 .extra.e3,.lv5 .extra.e3,.lv5 .extra.e4{display:block}
.bubbles{position:absolute;z-index:8;inset:0;overflow:hidden}.bubble{position:absolute;bottom:12%;width:var(--s,11px);height:var(--s,11px);border:2px solid #fff;border-radius:50%;background:#ffffff44;box-shadow:inset 2px 2px 3px #fff9,0 0 8px #fff7;animation:rise var(--dur,1.8s) linear forwards}.bubble.gold{border-color:var(--yellow);background:#fff2a477;box-shadow:0 0 13px #ffe35c;cursor:pointer}
@keyframes rise{0%{transform:translate(0,0) scale(.7);opacity:.4}20%{opacity:1}100%{transform:translate(var(--drift,8px),-210px) scale(1.2);opacity:0}}
.statusPill{position:absolute;z-index:12;left:8px;top:8px;max-width:58%;background:#ffffffdd;color:var(--deep);font-size:10px;font-weight:1000;padding:6px 9px;border-radius:13px;box-shadow:0 3px #0d4f9c22;pointer-events:none}.statusPill b{color:var(--red)}
.rush{position:absolute;z-index:15;left:50%;top:27%;transform:translate(-50%,-50%) scale(.6);font-size:21px;font-weight:1000;color:#fff;text-shadow:0 3px var(--deep),0 0 12px #fff;opacity:0;white-space:nowrap}.rush.show{animation:rush .8s ease-out}@keyframes rush{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:0;transform:translate(-50%,-68%) scale(1)}}
.fly{position:absolute;z-index:20;font-size:13px;font-weight:1000;color:#fff;text-shadow:0 2px var(--deep);pointer-events:none;animation:fly .65s ease-out forwards}@keyframes fly{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-48px) scale(1.3)}}
.bar{position:absolute;z-index:35;left:0;right:0;bottom:0;height:92px;padding:7px 10px calc(10px + var(--safe));display:flex;gap:7px;align-items:center;background:linear-gradient(transparent,#0c76b4aa)}
.btn{position:relative;flex:1;height:60px;border-radius:30px;background:#fff;color:var(--red);font-weight:1000;font-size:15px;box-shadow:0 4px var(--blue),0 0 0 3px var(--yellow) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}.btn:active{transform:translateY(3px);box-shadow:0 1px var(--blue),0 0 0 3px var(--yellow) inset}.btn .ico{font-size:23px}.miniGauge{position:absolute;left:12px;right:12px;bottom:-7px;height:10px;background:#d9e6ea;border-radius:99px;overflow:hidden;border:2px solid #fff}.miniGauge span{display:block;height:100%;background:var(--green);width:50%;transition:.1s}.need{animation:need .45s ease-in-out infinite alternate;background:var(--yellow)}@keyframes need{to{transform:scale(1.06)}}
.mute{position:absolute;z-index:40;right:8px;top:132px;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--deep);font-weight:1000;box-shadow:0 3px #0d4f9c55}
.title{position:absolute;z-index:50;inset:0;background:linear-gradient(#0d4f9ccc,#35b9f033 45%,#0d4f9ccc);display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:calc(28px + env(safe-area-inset-top)) 18px calc(22px + var(--safe))}
.chip{display:inline-block;background:var(--red);padding:6px 15px;border-radius:20px;font-size:12px;font-weight:1000;box-shadow:0 3px #a8000f}.logo{margin:10px 0 0;line-height:1}.logo span{display:block;color:var(--yellow);font-size:min(15vw,72px);font-weight:1000;text-shadow:0 5px #0d4f9c;-webkit-text-stroke:8px #fff;paint-order:stroke fill}.logo small{display:block;font-size:min(8vw,38px);color:#fff;font-weight:1000;text-shadow:0 4px #0d4f9c}.titleBot{pointer-events:none}.how{font-size:13px;font-weight:900;line-height:1.5;text-shadow:0 2px #0d4f9c;margin-bottom:10px}.how b{color:var(--yellow)}.play{pointer-events:auto;width:80%;max-width:320px;height:70px;border-radius:35px;background:var(--red);color:#fff;font-size:28px;font-weight:1000;letter-spacing:.08em;box-shadow:0 6px #a8000f,0 0 0 5px var(--yellow);animation:pulse 1.5s ease-in-out infinite}.bestLine{margin-top:10px;font-size:12px;font-weight:900}
.modal{position:absolute;z-index:70;inset:0;display:none;align-items:center;justify-content:center;background:#06326499;padding:22px}.modal.show{display:flex}.card{width:100%;max-width:340px;background:#fff;color:var(--deep);border-radius:30px;padding:20px;text-align:center;box-shadow:0 8px #0003,0 0 0 6px var(--red);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}.card h2{margin:0;color:var(--red);font-size:24px}.bigScore{font-size:48px;font-weight:1000;color:var(--red);line-height:1.05;margin-top:6px}.rank{display:inline-block;margin-top:6px;background:var(--yellow);color:#a84b00;padding:5px 13px;border-radius:16px;font-weight:1000}.retry{width:100%;height:58px;border-radius:29px;background:var(--red);color:#fff;font-size:20px;font-weight:1000;box-shadow:0 5px #a8000f,0 0 0 4px var(--yellow);margin-top:12px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media(max-height:650px){.hud{height:112px}.wave{top:110px}.stage{inset:122px 0 86px}.bar{height:86px}.btn{height:54px}.score{font-size:31px}.nextBubble{width:52px;height:52px}.evoItem{font-size:20px}.mute{top:119px}.title{padding-top:18px}.logo span{font-size:min(13vw,60px)}}
</style>
</head>
<body>
<div id="app">
 <section class="hud">
  <div class="row1">
   <div><div class="lbl">O₂ SCORE</div><div id="score" class="score">0000</div><div id="best" class="best">BEST 0000</div></div>
   <div class="nextBox"><div id="nextBubble" class="nextBubble">🌱</div><div class="nextText">NEXT<br><b id="nextText">あと 30</b></div></div>
  </div>
  <div id="evo" class="evo">
   <span class="evoItem on cur">🌱</span><span class="evoItem">🌿</span><span class="evoItem">🪴</span><span class="evoItem">🌳</span><span class="evoItem">✨</span>
  </div>
  <div class="wave"></div>
 </section>

 <main class="stage">
  <div id="sun" class="sun"></div><div id="ray" class="ray"></div>
  <div id="co2Bottle" class="co2Bottle"><div class="co2Knob"></div><div class="co2Valve"></div><div class="co2Body"></div></div><div class="hose"></div>
  <div class="tank">
   <div id="waterFill" class="waterFill"><div class="waterline"></div></div>
   <div id="co2Stream" class="co2Stream"><i class="co2Dot"></i><i class="co2Dot"></i><i class="co2Dot"></i><i class="co2Dot"></i></div>
   <div id="plant" class="plantWrap lv1">
    <div class="stem"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div><div class="leaf d"></div><div class="leaf e"></div>
    <div class="leaf a extra e1" style="left:30%;bottom:27%"></div><div class="leaf b extra e2" style="left:36%;bottom:45%"></div><div class="leaf c extra e3" style="left:22%;bottom:57%"></div><div class="leaf d extra e4" style="left:44%;bottom:70%"></div>
   </div>
   <div id="bubbles" class="bubbles"></div>
  </div>
  <div id="statusPill" class="statusPill">3つをそろえると <b>O₂</b> がふえる！</div>
  <div id="rush" class="rush">O₂ ラッシュ！</div>
 </main>

 <button id="mute" class="mute">🔊</button>

 <section class="bar">
  <button class="btn" data-k="light"><span class="ico">☀️</span>ひかり！<span class="miniGauge"><span id="gLight"></span></span></button>
  <button class="btn" data-k="water"><span class="ico">💧</span>みず！<span class="miniGauge"><span id="gWater"></span></span></button>
  <button class="btn" data-k="co2"><span class="ico">☁️</span>CO₂！<span class="miniGauge"><span id="gCo2"></span></span></button>
 </section>

 <section id="title" class="title">
  <div><div class="chip">光合成ゲーム</div><h1 class="logo"><span>光合成ラボ！</span><small>O₂をたくさんつくろう</small></h1></div>
  <div class="titleBot"><div class="how">☀️ 光 ＋ 💧 水 ＋ ☁️ 二酸化炭素<br>3つがそろうと <b>🌿光合成 → 🫧酸素！</b><br>ボタンを押して材料を届けよう！</div><button id="play" class="play">スタート！</button><div id="titleBest" class="bestLine">BEST 0000 O₂</div></div>
 </section>

 <section id="finish" class="modal"><div class="card"><h2>けんきゅう おわり！</h2><div id="finalScore" class="bigScore">0</div><div>O₂</div><div id="rank" class="rank">🌱 けんきゅういん</div><p id="resultText">3つをバランスよく届けよう！</p><button id="retry" class="retry">もういちど！</button></div></section>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const thresholds=[0,30,80,150,260],icons=['🌱','🌿','🪴','🌳','✨'];
const S={light:.45,water:.45,co2:.45,score:0,best:0,level:1,running:false,time:60,last:0,lastBubble:0,lastTick:0,highSince:null,muted:false,audio:null,master:null,soundReady:false,raf:0};
try{S.best=+localStorage.getItem('photosynthesis_best')||0}catch(e){}
function clamp(v){return Math.max(0,Math.min(1,v))}
function lightEff(v){return 1-Math.exp(-3*v)}
function power(){return Math.min(lightEff(S.light),S.water,S.co2)}
async function unlockAudio(){if(S.muted)return;if(!S.audio){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;S.audio=new C();S.master=S.audio.createGain();S.master.gain.value=.75;S.master.connect(S.audio.destination)}try{if(S.audio.state==='suspended')await S.audio.resume()}catch(e){}if(!S.soundReady&&S.audio.state==='running'){const o=S.audio.createOscillator(),g=S.audio.createGain(),t=S.audio.currentTime;g.gain.value=.0001;o.connect(g).connect(S.master);o.start(t);o.stop(t+.015);S.soundReady=true}}
function tone(f,d=.08,g=.055,type='sine',delay=0){if(S.muted||!S.audio||!S.master||S.audio.state!=='running')return;const t=S.audio.currentTime+delay,o=S.audio.createOscillator(),a=S.audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(g,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(S.master);o.start(t);o.stop(t+d+.02)}
function sfx(k){if(k==='tap'){tone(320,.05,.045,'triangle');tone(620,.05,.02,'sine',.02)}if(k==='bubble'){tone(560+Math.random()*90,.07,.03);tone(920,.04,.015,'triangle',.015)}if(k==='bonus'){tone(720,.08,.065,'triangle');tone(1080,.14,.055,'sine',.06)}if(k==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,.16,.055,'triangle',i*.075))}if(k==='end'){[440,392,330,262].forEach((f,i)=>tone(f,.18,.045,'sine',i*.11))}}
function fmt(n){return String(Math.floor(n)).padStart(4,'0')}
function calcLevel(score){let l=1;for(let i=1;i<thresholds.length;i++)if(score>=thresholds[i])l=i+1;return l}
function nextTarget(){return thresholds[Math.min(S.level,thresholds.length-1)]}
function updateHUD(){
 $('#score').textContent=fmt(S.score);$('#best').textContent='BEST '+fmt(S.best);$('#titleBest').textContent='BEST '+fmt(S.best)+' O₂';
 const nl=calcLevel(S.score);if(nl>S.level){S.level=nl;levelUp()}else S.level=nl;
 document.querySelectorAll('.evoItem').forEach((el,i)=>{el.classList.toggle('on',i<S.level);el.classList.toggle('cur',i===S.level-1)});
 $('#plant').className='plantWrap lv'+S.level;
 if(S.level<5){const target=thresholds[S.level];$('#nextBubble').textContent=icons[S.level];$('#nextText').textContent='あと '+Math.max(0,target-Math.floor(S.score))}else{$('#nextBubble').textContent='👑';$('#nextText').textContent='MAX！'}
}
function levelUp(){sfx('level');const r=$('#rush');r.textContent=S.level===5?'MAX 光合成！':'LEVEL UP！';r.classList.remove('show');void r.offsetWidth;r.classList.add('show')}
function addScore(n,x=58,y=38){S.score+=n;if(S.score>S.best){S.best=Math.floor(S.score);try{localStorage.setItem('photosynthesis_best',S.best)}catch(e){}}updateHUD();const p=document.createElement('div');p.className='fly';p.textContent='+'+n+' O₂';p.style.left=x+'%';p.style.top=y+'%';$('.stage').appendChild(p);setTimeout(()=>p.remove(),700)}
function spawnBubble(){
 const p=power(),gold=Math.random()<(.05+p*.08),b=document.createElement('div');b.className='bubble'+(gold?' gold':'');b.style.setProperty('--s',(gold?14:8)+Math.random()*(gold?8:9)+'px');b.style.left=(44+Math.random()*16)+'%';b.style.setProperty('--dur',(1.15+Math.random()*.8)+'s');b.style.setProperty('--drift',(-12+Math.random()*24)+'px');$('#bubbles').appendChild(b);
 if(gold)b.addEventListener('pointerdown',async e=>{e.preventDefault();await unlockAudio();if(b.dataset.hit)return;b.dataset.hit='1';addScore(5);sfx('bonus');b.classList.add('pop');setTimeout(()=>b.remove(),160)});
 b.addEventListener('animationend',()=>{if(!b.dataset.hit){addScore(gold?2:1);if(Math.random()<.2)sfx('bubble')}b.remove()})
}
function updateNeed(){
 const vals=[['light',S.light,'☀️ ひかり'],['water',S.water,'💧 みず'],['co2',S.co2,'☁️ CO₂']];
 vals.forEach(([k,v])=>$('#g'+(k==='light'?'Light':k==='water'?'Water':'Co2')).style.width=Math.round(v*100)+'%');
 const weakest=vals.slice().sort((a,b)=>a[1]-b[1])[0];
 document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('need',b.dataset.k===weakest[0]&&weakest[1]<.5));

 // 光：供給量に応じて太陽そのものと日照を変える
 $('#sun').style.setProperty('--sunScale',(0.65+S.light*.75).toFixed(2));
 $('#sun').style.setProperty('--sunGlow',(8+S.light*38)+'px');
 $('#ray').style.setProperty('--rayOpacity',(.08+S.light*.82).toFixed(2));

 // 水：水槽の実際の水位を上下させる
 $('#waterFill').style.setProperty('--waterHeight',(25+S.water*70)+'%');

 // CO2：水中への注入泡を供給量に応じて見せる
 $('#co2Stream').style.opacity=(.12+S.co2*.68).toFixed(2);

 const p=power(),st=$('#statusPill');
 if(p>.83)st.innerHTML='🔥 <b>光合成チャンス！</b> O₂がいっぱい！';
 else st.innerHTML='もっと必要：<b>'+weakest[2]+'</b>';
}
function animateSupply(k){
 if(k==='light'){
  const sun=$('#sun');sun.classList.remove('feedFlash');void sun.offsetWidth;sun.classList.add('feedFlash');setTimeout(()=>sun.classList.remove('feedFlash'),300);
 }
 if(k==='water'){
  const w=$('#waterFill');w.animate([{filter:'brightness(1)'},{filter:'brightness(1.25)'},{filter:'brightness(1)'}],{duration:280});
 }
 if(k==='co2'){
  const b=$('#co2Bottle'),s=$('#co2Stream');b.classList.add('puff');s.classList.add('burst');setTimeout(()=>{b.classList.remove('puff');s.classList.remove('burst')},650);
 }
}
function feed(k,btn){S[k]=clamp(S[k]+.115);sfx('tap');animateSupply(k);btn.style.transform='translateY(3px) scale(1.03)';setTimeout(()=>btn.style.transform='',90);updateNeed();if(power()>.85&&Math.random()<.25){const r=$('#rush');r.textContent='O₂ ラッシュ！';r.classList.remove('show');void r.offsetWidth;r.classList.add('show')}}
function decay(dt){S.light=clamp(S.light-dt*.021);S.water=clamp(S.water-dt*.018);S.co2=clamp(S.co2-dt*.023)}
function loop(ts){
 if(!S.running)return;const dt=Math.min(.05,(ts-S.last)/1000||0);S.last=ts;S.time-=dt;decay(dt);updateNeed();
 const p=power(),interval=1250-p*1030;if(ts-S.lastBubble>interval){spawnBubble();S.lastBubble=ts}
 if(ts-S.lastTick>1000){const gain=Math.max(0,Math.round(p*(S.level*.65+1)));if(gain)addScore(gain,77,18);S.lastTick=ts}
 if(S.time<=0){finish();return}S.raf=requestAnimationFrame(loop)
}
async function start(){await unlockAudio();S.light=.44;S.water=.44;S.co2=.44;S.score=0;S.level=1;S.time=60;S.running=true;S.last=performance.now();S.lastBubble=S.last;S.lastTick=S.last;$('#title').style.display='none';$('#finish').classList.remove('show');updateHUD();updateNeed();requestAnimationFrame(loop)}
function finish(){S.running=false;cancelAnimationFrame(S.raf);sfx('end');$('#finalScore').textContent=Math.floor(S.score);let r='🌱 けんきゅういん',t='3つをバランスよく届けると、もっとO₂が増えるよ！';if(S.score>=260){r='👑 光合成マスター';t='光・水・CO₂をそろえて、植物をMAXまで育てた！'}else if(S.score>=150){r='🌳 光合成エース';t='足りない材料をすばやく見つけられた！'}else if(S.score>=80){r='🪴 O₂名人';t='光合成のコツがわかってきた！'}$('#rank').textContent=r;$('#resultText').textContent=t;$('#finish').classList.add('show')}
document.querySelectorAll('.btn').forEach(btn=>btn.addEventListener('pointerdown',async e=>{e.preventDefault();if(!S.running)return;await unlockAudio();feed(btn.dataset.k,btn)}));
document.addEventListener('pointerdown',()=>unlockAudio(),{once:true,capture:true});
$('#play').addEventListener('click',start);$('#retry').addEventListener('click',start);$('#mute').addEventListener('click',async e=>{S.muted=!S.muted;e.currentTarget.textContent=S.muted?'🔇':'🔊';if(!S.muted){await unlockAudio();sfx('level')}});
updateHUD();updateNeed();
})();
</script>
</body>

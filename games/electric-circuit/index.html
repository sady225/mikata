<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07516d">
<title>電気回路のひみつ！ — 子どものMIKATA</title>
<style>
:root{--blue:#0a6687;--navy:#06384b;--yellow:#ffdd62;--orange:#f49a4c;--green:#42a875;--red:#d85c55;--ink:#173f4b;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#052f40}body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--ink)}button{font:inherit}
#app{width:min(100vw,480px);height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#42b7cd,#93dfe6 48%,#edf5dc);user-select:none}
header{position:absolute;z-index:20;top:0;left:0;right:0;min-height:calc(88px + var(--safe-top));padding:calc(8px + var(--safe-top)) 11px 8px;background:linear-gradient(#0b6888,#07506a);color:white;border-bottom:3px solid #ffffff88}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:10px;font-weight:1000}.stage{font-size:12px;font-weight:1000;background:#ffffff24;padding:5px 9px;border-radius:999px}.hud{display:flex;gap:6px}.hud button{border:0;border-radius:999px;min-height:32px;background:white;color:#07506a;font-weight:1000;font-size:11px;padding:0 10px}.progress{height:7px;margin-top:7px;background:#ffffff25;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--yellow);transition:width .2s}
.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}.title{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(100px + var(--safe-top)) 18px calc(16px + var(--safe-bottom))}
.badge{background:#fff;color:#0b6787;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:1000}.title h1{font-size:clamp(35px,10vw,48px);line-height:1.05;margin:12px 0 5px;color:#fff;text-shadow:0 4px #07516d}.title h1 em{font-style:normal;color:var(--yellow)}.subtitle{font-size:14px;font-weight:900;color:#0a4d63}.hero{width:min(76vw,290px);height:min(31dvh,225px);display:grid;place-items:center}.start,.check,.next,.retry,.small{border:0;border-radius:999px;background:var(--yellow);color:#7b4c17;font-weight:1000;box-shadow:0 5px #c59531,0 0 0 3px white inset}.start{width:min(86vw,320px);min-height:56px;font-size:20px}.title small{max-width:340px;font-size:11px;line-height:1.45;color:#0a536b;font-weight:800;margin-top:10px}
.game{flex-direction:column;padding-top:calc(96px + var(--safe-top));min-height:0}.task{flex:0 0 auto;margin:6px 10px 4px;background:#fff;border-radius:17px;padding:7px 10px;box-shadow:0 4px #0a728c30}.task b{display:block;color:var(--orange);font-size:10px}.task h2{font-size:16px;margin:2px 0}.task p{font-size:10px;margin:0;color:#5e7a84;font-weight:800;line-height:1.32}
.lab{position:relative;flex:1 1 auto;min-height:220px;margin:0 8px 4px;border:3px solid #ffffffb5;border-radius:22px;background:linear-gradient(#f9feffdd,#edf8f5e9);overflow:hidden}.lab svg{width:100%;height:100%;display:block;touch-action:none}.component-label{font-size:12px;font-weight:1000;fill:#365661}.terminal{fill:#fff;stroke:#244e5a;stroke-width:3}.terminal.hot{fill:#ffe66d;stroke:#d28b23}.wire{fill:none;stroke:#334f5a;stroke-width:8;stroke-linecap:round}.wire.live{stroke:#ef9c3e}.wireEnd{fill:#f6f8f8;stroke:#334f5a;stroke-width:4}.glow{opacity:0}.on .glow{opacity:1;filter:drop-shadow(0 0 18px #ffd95a)}.filament{stroke:#7d5d24;stroke-width:3;fill:none}.on .filament{stroke:#fff3a4}.currentDot{fill:#fff176;opacity:0}.on .currentDot{opacity:1;animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.25}}
.message{flex:0 0 auto;margin:0 10px 4px;min-height:40px;border-radius:14px;padding:6px 9px;background:#fffffff2;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900}.message.good{background:#e6f8df;color:#2e684a}.message.warn{background:#fff0d7;color:#8a5c20}.message.bad{background:#ffe3df;color:#9b403b}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:0 0 auto}.good .dot{background:var(--green)}.warn .dot{background:var(--orange)}.bad .dot{background:var(--red)}
.controls{flex:0 0 auto;background:#07516de8;color:white;border-top:3px solid #ffffff72;padding:8px 10px calc(10px + var(--safe-bottom))}.controlTitle{text-align:center;font-size:10px;font-weight:1000;color:#dff8ff;margin:0 0 6px}.check{width:100%;min-height:44px;font-size:14px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.choice{border:0;border-radius:13px;background:#fff;color:#07516d;min-height:46px;font-weight:1000;font-size:11px;box-shadow:0 4px #003e54}.choice.active{background:var(--yellow)}.hint{text-align:center;font-size:9px;font-weight:800;color:#d8f4fa;margin-top:6px}
.overlay{position:absolute;z-index:60;inset:0;display:none;place-items:center;padding:18px;background:#052f42dd}.overlay.show{display:grid}.card{width:100%;max-width:350px;background:white;border-radius:24px;padding:19px;text-align:center;box-shadow:0 10px #052938}.card .emoji{font-size:42px}.card h2{margin:2px 0 6px;color:var(--green);font-size:26px}.card p{font-size:12px;line-height:1.55;font-weight:800;color:#49656e}.next,.retry,.small{width:100%;min-height:48px;font-size:16px;margin-top:8px}.discList{text-align:left;max-height:48dvh;overflow:auto;padding:0;list-style:none}.discList li{background:#eff8f3;margin:6px 0;padding:8px 10px;border-radius:12px;font-size:11px;font-weight:800}.discList li.locked{background:#f1f2f2;color:#9aa5a8}
@media(max-height:650px){header{min-height:calc(78px + var(--safe-top));padding-top:calc(5px + var(--safe-top))}.game{padding-top:calc(85px + var(--safe-top))}.task{padding:5px 8px}.task p{display:none}.lab{min-height:185px}.message{min-height:32px;font-size:10px}.choice{min-height:40px}}
@media(max-height:570px){.brand{display:none}.game{padding-top:calc(75px + var(--safe-top))}.lab{min-height:160px}}
</style>
</head>
<body>
<div id="app">
<header><div class="headrow"><div><div class="brand">子どものMIKATA｜理科体験ゲーム</div><div id="stageLabel" class="stage">💡 1 / 7</div></div><div class="hud"><button id="discoverBtn">🔬 発見 0</button><button id="muteBtn">🔊</button></div></div><div class="progress"><span id="progress"></span></div></header>

<main id="title" class="screen title active">
<div class="badge">危険を見抜いて止める</div><h1>電気回路の<br><em>ひみつ！</em></h1>
<p class="subtitle">正常？ 故障？ 危険？ 回路を見て、安全な行動を選ぼう。</p>
<div class="hero" aria-hidden="true"><svg viewBox="0 0 300 230"><rect x="28" y="85" width="78" height="90" rx="16" fill="#f6f7f2" stroke="#315762" stroke-width="6"/><text x="67" y="133" text-anchor="middle" font-size="32" font-weight="1000" fill="#d7554c">＋</text><circle cx="228" cy="120" r="42" fill="#fff6bd" stroke="#315762" stroke-width="7"/><path d="M107 100 C145 60 190 64 210 91" fill="none" stroke="#334f5a" stroke-width="8" stroke-linecap="round"/><path d="M106 160 C145 200 194 183 212 150" fill="none" stroke="#334f5a" stroke-width="8" stroke-linecap="round"/></svg></div>
<button id="startBtn" class="start">安全パトロール開始</button><small>危険なら止める、故障なら直す、正常ならむやみに触らない。ゲーム内の疑似実験で安全判断を身につけます。</small>
</main>

<main id="game" class="screen game">
<section class="task"><b id="mission"></b><h2 id="taskTitle"></h2><p id="taskText"></p></section>
<section id="lab" class="lab"></section>
<div id="message" class="message warn"><span class="dot"></span><span></span></div>
<section class="controls"><p id="controlTitle" class="controlTitle"></p><div id="controls"></div></section>
</main>

<div id="stageOverlay" class="overlay"><div class="card"><div id="clearEmoji" class="emoji">✨</div><h2 id="clearTitle">できた！</h2><p id="clearText"></p><button id="nextBtn" class="next">次の実験へ</button></div></div>
<div id="whyOverlay" class="overlay"><div class="card"><div class="emoji">🤔</div><h2>なぜ？</h2><p id="whyText"></p><button id="whyClose" class="small">もう一度試す</button></div></div>
<div id="dangerOverlay" class="overlay"><div class="card"><div class="emoji">⚠️</div><h2>ちょっと待って！</h2><p>乾電池の＋極と−極を、電球などを通さず導線だけで直接つなぐのは危険。大きな電流が流れて、電池や導線が熱くなることがあるよ。実際の実験ではやらないでね。</p><button id="dangerClose" class="small">安全な回路に戻す</button></div></div>
<div id="discoverOverlay" class="overlay"><div class="card"><div class="emoji">🔬</div><h2>発見コレクション</h2><ul id="discList" class="discList"></ul><button id="closeDisc" class="small">戻る</button></div></div>
<div id="finishOverlay" class="overlay"><div class="card"><div class="emoji">⚡✨</div><h2>回路研究員！</h2><p id="finishText"></p><button id="showDisc" class="small">発見を見る</button><button id="retryBtn" class="retry">最初からもう一度</button></div></div>
</div>

<script>
(()=>{
let stage=0,muted=false,audio=null,drag=null,trial={},scenarioIndex=0,patrolCorrect=0;
const discoveries=new Set();
const all=[
['normal','正常な閉回路 → むやみに止めなくてよい'],
['open','回路が切れている → 光らないが、短絡とは違う'],
['short','＋極と−極の直接接続 → 危険なので止める'],
['stop-short','危険な導線を外す → 短絡を止められる'],
['repair','接点の外れ → 原因を見つけて修理できる'],
['series-break','直列回路 → 1か所切れると両方消える'],
['parallel-one','並列回路 → 片方が切れても他方は光る'],
['dont-touch','正常な回路 → 不要な操作をしないことも安全'],
['diagnose','「危険」「故障」「正常」を現象から見分ける'],
['patrol','危険を止め、故障を直し、正常を守れた']
];
const defs=[
['🛑 1 / 7','MISSION 01','危険なつなぎ方を止めろ！','＋極と−極を直接つなごうとしている。危険だと思ったら接続前に止めよう。'],
['⚠️ 2 / 7','MISSION 02','短絡を解除しよう','危険な導線がすでにつながっている。どの導線を外せば安全になる？'],
['✅ 3 / 7','MISSION 03','正常な回路を守ろう','電球が正しく光っている。止める必要がある？ まず状態を判断しよう。'],
['🛠️ 4 / 7','MISSION 04','「危険」と「故障」を見分けよう','電球が消えている。でも、消えている＝危険とは限らない。原因を調べよう。'],
['🔗 5 / 7','MISSION 05','直列回路の故障診断','2個とも消えた。危険だから止める？ それとも回路が切れている？'],
['🌿 6 / 7','MISSION 06','並列回路の故障診断','片方だけ消えた。どの枝に問題があるか見つけて安全に直そう。'],
['🚨 7 / 7','MISSION 07','電気安全パトロール','正常・故障・危険がランダムに出る。3件連続で正しく対応しよう。']
];
const $=s=>document.querySelector(s),lab=$('#lab'),controls=$('#controls'),msg=$('#message');
let model={nodes:{},wires:[],bulbs:[]};

function setMsg(t,c='warn'){msg.className='message '+c;msg.querySelector('span:last-child').textContent=t}
function add(id){if(!discoveries.has(id)){discoveries.add(id);$('#discoverBtn').textContent='🔬 発見 '+discoveries.size;tone(720,.05,.018)}}
function ensureAudio(){if(muted)return null;if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio&&audio.state==='suspended')audio.resume();return audio}
function tone(f=440,d=.06,g=.02){const ctx=ensureAudio();if(!ctx)return;const o=ctx.createOscillator(),a=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.value=f;a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(g,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(ctx.destination);o.start();o.stop(t+d+.03)}
function bulb(x,y,id){return '<g id="'+id+'"><circle class="glow" cx="'+x+'" cy="'+y+'" r="45" fill="#ffd95a" opacity=".5"/><circle cx="'+x+'" cy="'+y+'" r="34" fill="#fff9d5" stroke="#315762" stroke-width="6"/><path class="filament" d="M'+(x-14)+' '+y+' Q'+x+' '+(y-22)+' '+(x+14)+' '+y+' Q'+x+' '+(y+22)+' '+(x-14)+' '+y+'"/><rect x="'+(x-14)+'" y="'+(y+32)+'" width="28" height="24" rx="4" fill="#afb8ba" stroke="#315762" stroke-width="5"/></g>'}
function battery(x,y){return '<g id="battery"><rect x="'+x+'" y="'+y+'" width="70" height="95" rx="14" fill="#f8f8f2" stroke="#315762" stroke-width="6"/><text x="'+(x+24)+'" y="'+(y+54)+'" font-size="27" font-weight="1000" fill="#d7554c">＋</text><text x="'+(x+49)+'" y="'+(y+54)+'" font-size="25" font-weight="1000" fill="#315762">−</text></g>'}
function term(id,x,y){model.nodes[id]={x,y};return '<circle id="n-'+id+'" class="terminal" cx="'+x+'" cy="'+y+'" r="11"/>'}
function reset(two=false,j=false){
 model={nodes:{},wires:[],bulbs:[]};
 let s=battery(25,102)+term('bp',52,102)+term('bm',89,117)+bulb(298,two?82:145,'b1')+term('b1a',284,two?126:189)+term('b1b',312,two?126:189);
 model.bulbs.push({id:'b1',a:'b1a',b:'b1b'});
 if(two){s+=bulb(298,205,'b2')+term('b2a',284,249)+term('b2b',312,249);model.bulbs.push({id:'b2',a:'b2a',b:'b2b'})}
 if(j){s+='<circle cx="170" cy="90" r="20" fill="#eef6f8" stroke="#315762" stroke-width="5"/>'+term('j1',170,90)+'<circle cx="170" cy="230" r="20" fill="#eef6f8" stroke="#315762" stroke-width="5"/>'+term('j2',170,230)}
 lab.innerHTML='<svg id="svg" viewBox="0 0 390 300">'+s+'<g id="wireLayer"></g></svg>';
 Object.keys(model.nodes).forEach(id=>$('#n-'+id).addEventListener('pointerdown',e=>startNewWire(e,id)));
 renderWires();evaluate()
}
function offsetFree(from){const p=model.nodes[from];return{x:Math.min(360,p.x+(p.x<180?75:-75)),y:Math.max(28,Math.min(272,p.y+(Math.random()>.5?35:-35)))}}
function addWire(from,to=null,free=null){model.wires.push({from,to,free:free||offsetFree(from)});renderWires();evaluate();return model.wires.length-1}
function startNewWire(e,from){e.preventDefault();const i=addWire(from,null);drag={i,pid:e.pointerId};$('#svg').setPointerCapture?.(e.pointerId)}
function startEndDrag(e,i){e.preventDefault();e.stopPropagation();model.wires[i].to=null;drag={i,pid:e.pointerId};$('#svg').setPointerCapture?.(e.pointerId);evaluate()}
function nearest(x,y,except){let best=null,bd=999;for(const [id,p] of Object.entries(model.nodes)){if(id===except)continue;const d=Math.hypot(x-p.x,y-p.y);if(d<34&&d<bd){best=id;bd=d}}return best}
function renderWires(){
 const layer=$('#wireLayer');if(!layer)return;layer.innerHTML='';
 model.wires.forEach((w,i)=>{
   const a=model.nodes[w.from],b=w.to?model.nodes[w.to]:w.free;
   const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','wire');path.setAttribute('d','M'+a.x+' '+a.y+' C'+((a.x+b.x)/2)+' '+a.y+' '+((a.x+b.x)/2)+' '+b.y+' '+b.x+' '+b.y);layer.appendChild(path);
   const end=document.createElementNS('http://www.w3.org/2000/svg','circle');end.setAttribute('class','wireEnd');end.setAttribute('cx',b.x);end.setAttribute('cy',b.y);end.setAttribute('r','14');end.dataset.i=i;end.addEventListener('pointerdown',e=>startEndDrag(e,i));layer.appendChild(end)
 })
}
lab.addEventListener('pointermove',e=>{if(!drag)return;const s=$('#svg'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(s.getScreenCTM().inverse());model.wires[drag.i].free={x:q.x,y:q.y};renderWires()});
lab.addEventListener('pointerup',e=>{if(!drag)return;const s=$('#svg'),p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(s.getScreenCTM().inverse());const w=model.wires[drag.i],target=nearest(q.x,q.y,w.from);if(target){w.to=target;w.free={...model.nodes[target]};tone(360,.04,.02)}drag=null;renderWires();evaluate()});

function graph(includeBulbs=true){
 const g={};Object.keys(model.nodes).forEach(k=>g[k]=[]);
 model.wires.filter(w=>w.to).forEach(w=>{g[w.from].push(w.to);g[w.to].push(w.from)});
 if(includeBulbs)model.bulbs.forEach(b=>{g[b.a].push(b.b);g[b.b].push(b.a)});
 return g
}
function reachable(a,b,g,skip=null){if(!g[a]||!g[b])return false;const q=[a],seen=new Set([a]);while(q.length){const n=q.shift();if(n===b)return true;for(const v of g[n]){if(skip&&((n===skip[0]&&v===skip[1])||(n===skip[1]&&v===skip[0])))continue;if(!seen.has(v)){seen.add(v);q.push(v)}}}return false}
function bulbOn(b,g){const skip=[b.a,b.b];return (reachable('bp',b.a,g,skip)&&reachable(b.b,'bm',g,skip))||(reachable('bp',b.b,g,skip)&&reachable(b.a,'bm',g,skip))}
function classify(){
 const wg=graph(false),g=graph(true),short=reachable('bp','bm',wg),ons=model.bulbs.map(b=>bulbOn(b,g));
 let type=short?'short':reachable('bp','bm',g)?'closed':'open';
 if(!short&&ons.length===2&&ons[0]&&ons[1]){
   const b1=model.bulbs[0],b2=model.bulbs[1];
   type=(reachable('bp','bm',g,[b1.a,b1.b])&&reachable('bp','bm',g,[b2.a,b2.b]))?'parallel':'series'
 }
 return{type,short,ons}
}
function evaluate(){
 const s=classify();
 model.bulbs.forEach((b,i)=>$('#'+b.id)?.classList.toggle('on',!!s.ons[i]));
 [...lab.querySelectorAll('.wire')].forEach(x=>x.classList.toggle('live',s.type!=='open'&&!s.short));
 if(s.short)setMsg('⚠ 危険：電球を通らず＋極と−極が直接つながっている。','bad');
 else if(s.type==='open')setMsg('回路が切れている。光らないが、短絡とは別の状態。','warn');
 else if(s.type==='series')setMsg('2個とも点灯。直列の正常な閉回路。','good');
 else if(s.type==='parallel')setMsg('2個とも点灯。並列の正常な閉回路。','good');
 else if(s.ons[0])setMsg('電球が点灯している正常な閉回路。','good');
 return s
}
function clear(t,x,e='✨'){$('#clearTitle').textContent=t;$('#clearText').textContent=x;$('#clearEmoji').textContent=e;$('#stageOverlay').classList.add('show');tone(660,.08,.025)}
function why(text){$('#whyText').textContent=text;$('#whyOverlay').classList.add('show')}
function choices(html){controls.innerHTML='<div class="choices">'+html+'</div>'}
function render(){
 const d=defs[stage];$('#stageLabel').textContent=d[0];$('#mission').textContent=d[1];$('#taskTitle').textContent=d[2];$('#taskText').textContent=d[3];$('#progress').style.width=((stage+1)/7*100)+'%';controls.innerHTML='';trial={};
 [r1,r2,r3,r4,r5,r6,r7][stage]()
}
function r1(){
 $('#controlTitle').textContent='接続する前に判断する';
 reset(false,false);addWire('bp','b1a');addWire('b1b','bm');const danger=addWire('bp');
 choices('<button id="stop" class="choice">🛑 危険！止める</button><button id="go" class="choice">🔌 そのままつなぐ</button>');
 $('#stop').onclick=()=>{model.wires.splice(danger,1);renderWires();evaluate();add('short');add('stop-short');clear('危険を未然に止めた！','＋極と−極を電球を通さず直接つなぐ短絡を、接続前に止められた。','🛑')};
 $('#go').onclick=()=>{model.wires[danger].to='bm';model.wires[danger].free={...model.nodes.bm};renderWires();evaluate();add('short');$('#dangerOverlay').classList.add('show')}
}
function r2(){
 $('#controlTitle').textContent='危険な導線を見つけ、端を外す';
 reset(false,false);addWire('bp','b1a');addWire('b1b','bm');addWire('bp','bm');add('short');evaluate();
 controls.innerHTML='<button id="check" class="check">🛑 短絡を解除した</button><button id="why" class="small">🤔 なぜ危険？</button>';
 $('#why').onclick=()=>why('電球などを通らず＋極と−極が直接つながると、大きな電流が流れて電池や導線が熱くなることがある。実物では試さないでね。');
 $('#check').onclick=()=>{const s=evaluate();if(!s.short&&s.ons[0]){add('stop-short');clear('安全な回路に戻した！','危険な直結だけを外し、必要な回路は残せた。','⚠️')}else setMsg('危険な直結だけを外そう。正常な電球回路まで全部外す必要はないよ。','warn')}
}
function r3(){
 $('#controlTitle').textContent='正常なものまで止めない';
 reset(false,false);addWire('bp','b1a');addWire('b1b','bm');evaluate();add('normal');
 choices('<button id="stop" class="choice">🛑 止める</button><button id="leave" class="choice">✅ 正常なので触らない</button>');
 $('#leave').onclick=()=>{add('dont-touch');clear('正常を見分けた！','安全では「危険を止める」だけでなく、正常な状態を見分けることも大切。','✅')};
 $('#stop').onclick=()=>setMsg('これは正常な閉回路。何でも止めるのではなく、危険かどうかを見分けよう。','warn')
}
function r4(){
 $('#controlTitle').textContent='光らない原因を調べる';
 reset(false,false);addWire('bp','b1a');addWire('bm');evaluate();add('open');
 choices('<button id="danger" class="choice">⚠ 危険だから全部外す</button><button id="repair" class="choice">🛠️ 外れた接点を修理</button>');
 $('#danger').onclick=()=>setMsg('光らない＝短絡とは限らない。これは回路が途中で切れた「故障」だよ。','warn');
 $('#repair').onclick=()=>{model.wires[1].to='b1b';model.wires[1].free={...model.nodes.b1b};renderWires();const s=evaluate();if(s.ons[0]){add('repair');add('diagnose');clear('故障を安全に修理！','危険な短絡ではなく、接点が外れていた故障だと見分けて直せた。','🛠️')}}
}
function r5(){
 $('#controlTitle').textContent='2個とも消えた原因を診断';
 reset(true,false);addWire('bp','b1a');addWire('b1b','b2a');addWire('b2b');evaluate();
 controls.innerHTML='<button id="why" class="small">🤔 危険？ 故障？</button><button id="repair" class="check">🔧 切れた場所を直す</button>';
 $('#why').onclick=()=>why('直列回路は電流の道が1本。1か所切れると両方消える。でも、＋極と−極の直接接続ではないので短絡とは違うよ。');
 $('#repair').onclick=()=>{model.wires[2].to='bm';model.wires[2].free={...model.nodes.bm};renderWires();const s=evaluate();if(s.type==='series'){add('series-break');add('diagnose');clear('直列の故障を修理！','2個とも消えていても、危険な短絡ではなく1本の道が切れた故障だった。','🔗')}}
}
function r6(){
 $('#controlTitle').textContent='片方だけ消えた枝を見つける';
 reset(true,true);addWire('bp','j1');addWire('j1','b1a');addWire('b1b','j2');addWire('j1','b2a');addWire('b2b');addWire('j2','bm');evaluate();
 controls.innerHTML='<button id="check" class="check">🛠️ 消えた枝を修理</button><button id="why" class="small">🤔 なぜ片方は光る？</button>';
 $('#why').onclick=()=>why('並列回路では電流の道が枝分かれしている。一方の枝が切れても、もう一方には一周できる道が残るよ。');
 $('#check').onclick=()=>{model.wires[4].to='j2';model.wires[4].free={...model.nodes.j2};renderWires();const s=evaluate();if(s.type==='parallel'){add('parallel-one');add('repair');clear('枝の故障を修理！','片方だけ消えた現象から、問題のある枝を見つけて直せた。','🌿')}}
}
function setupPatrolScenario(kind){
 if(kind==='short'){reset(false,false);addWire('bp','b1a');addWire('b1b','bm');addWire('bp','bm');setMsg('この回路は正常・故障・危険のどれ？','warn')}
 if(kind==='open'){reset(false,false);addWire('bp','b1a');addWire('bm');setMsg('電球が消えている。状態を判断しよう。','warn')}
 if(kind==='normal'){reset(false,false);addWire('bp','b1a');addWire('b1b','bm');setMsg('電球は光っている。状態を判断しよう。','good')}
 trial.kind=kind;evaluate()
}
function r7(){
 $('#controlTitle').textContent='3件連続で正しく判断する';
 patrolCorrect=0;scenarioIndex=0;nextPatrol();
}
function nextPatrol(){
 const seq=['short','open','normal'];const kind=seq[(scenarioIndex+Math.floor(Math.random()*3))%3];setupPatrolScenario(kind);
 controls.innerHTML='<div class="choices"><button data-a="danger" class="choice">🛑 危険</button><button data-a="fault" class="choice">🛠️ 故障</button></div><div class="choices" style="margin-top:7px"><button data-a="normal" class="choice">✅ 正常</button><button id="why" class="choice">🤔 ヒント</button></div><div class="hint">正解 '+patrolCorrect+' / 3</div>';
 controls.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>patrolAnswer(b.dataset.a));
 $('#why').onclick=()=>why('短絡＝危険。回路が切れているだけ＝故障。電球を通る閉回路で短絡がない＝正常。見た目ではなく電流の道をたどろう。')
}
function patrolAnswer(a){
 const expected=trial.kind==='short'?'danger':trial.kind==='open'?'fault':'normal';
 if(a!==expected){setMsg('違うよ。電流がどの道を通るか、＋極から−極までたどってみよう。','bad');return}
 patrolCorrect++;scenarioIndex++;add('diagnose');tone(620,.06,.02);
 if(patrolCorrect>=3){add('patrol');clear('安全パトロール完了！','危険は止める、故障は直す、正常はむやみに触らない。3つを見分けられた！','🚨')}
 else nextPatrol()
}
function showDisc(){const ul=$('#discList');ul.innerHTML='';all.forEach(([id,t])=>{const li=document.createElement('li');li.className=discoveries.has(id)?'':'locked';li.textContent=(discoveries.has(id)?'✅ ':'🔒 ')+t;ul.appendChild(li)});$('#discoverOverlay').classList.add('show')}
$('#startBtn').onclick=()=>{$('#title').classList.remove('active');$('#game').classList.add('active');stage=0;render()};
$('#nextBtn').onclick=()=>{$('#stageOverlay').classList.remove('show');if(stage<6){stage++;render()}else{$('#finishText').textContent='発見 '+discoveries.size+' / '+all.length+'。危険・故障・正常を見分けて、安全に対応できた。';$('#finishOverlay').classList.add('show')}};
$('#retryBtn').onclick=()=>{$('#finishOverlay').classList.remove('show');discoveries.clear();$('#discoverBtn').textContent='🔬 発見 0';stage=0;render()};
$('#discoverBtn').onclick=showDisc;$('#showDisc').onclick=showDisc;$('#closeDisc').onclick=()=>$('#discoverOverlay').classList.remove('show');
$('#whyClose').onclick=()=>$('#whyOverlay').classList.remove('show');
$('#dangerClose').onclick=()=>{$('#dangerOverlay').classList.remove('show');if(stage===0){render()}};
$('#muteBtn').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊'};
})();
</script>
</body></html>

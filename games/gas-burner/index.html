*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:#06324f;color:white}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}

.screen{position:absolute;inset:0;z-index:2;display:none}.screen.active{display:block}.titleScreen{padding:157px 20px 20px;text-align:center}.tag{display:inline-block;background:#fff;color:#0b669b;padding:7px 16px;border-radius:100px;font-size:13px;font-weight:1000;box-shadow:0 4px #036f9a}.titleScreen h1{font-size:clamp(33px,9vw,46px);color:#fff;margin:13px 0 0;text-shadow:3px 4px 0 #026a9b;letter-spacing:-.05em}.titleScreen h1 em{font-style:normal;color:var(--yellow)}.subtitle{font-weight:900;color:#064767;font-size:14px;margin:6px 0 0}.hero{position:relative;margin:0 auto;height:min(39dvh,315px);min-height:215px;max-width:330px;display:flex;justify-content:center;align-items:center}.hero .labsvg{width:90%;height:100%;filter:drop-shadow(0 13px 12px #004d6270)}.startBtn,.action{display:block;border:0;background:var(--yellow);color:#94422b;font-weight:1000;border-radius:40px;box-shadow:0 6px 0 #c18d28,0 0 0 3px white inset}.startBtn{width:100%;max-width:300px;margin:4px auto;padding:16px;font-size:22px;animation:bob 2s ease-in-out infinite}.startBtn:active,.action:active{transform:translateY(4px);box-shadow:0 2px 0 #c18d28,0 0 0 3px white inset}.caption{font-size:12px;color:#06496a;font-weight:800}.safety{color:#084866;font-size:11px;line-height:1.4;font-weight:800;margin:12px auto 0;max-width:335px}.game{padding-top:149px}.task{background:#fff;color:#10495f;border-radius:23px;padding:11px 14px;position:relative;margin:0 15px 5px;box-shadow:0 5px #0087ae66}.task .kicker{font-weight:1000;color:var(--red);font-size:11px}.task h2{font-weight:1000;font-size:clamp(17px,4.4vw,22px);margin:2px 0}.task p{margin:0;font-size:12px;line-height:1.45;font-weight:800;color:#477180}.timer{float:right;background:#e5f7fc;border-radius:20px;padding:4px 9px;font-weight:900;color:#0c6f95}.labArea{height:calc(100dvh - 475px);min-height:135px;max-height:330px;display:flex;justify-content:center;align-items:center;position:relative}.labArea svg{height:100%;width:100%;max-width:340px;overflow:visible}.labArea .flameY{transform-origin:50% 100%;animation:flicker .75s ease-in-out infinite alternate}.labArea .flameB{transform-origin:50% 100%;animation:flicker .5s ease-in-out infinite alternate}@keyframes flicker{to{transform:scale(.9,1.08) rotate(2deg)}}@keyframes bob{50%{transform:translateY(-6px)}}.note{position:absolute;z-index:1;top:9px;right:13px;color:#08516c;font-size:11px;font-weight:900;background:#ffffffda;padding:6px 9px;border-radius:20px}.message{min-height:53px;margin:2px 14px 7px;border-radius:15px;background:#ffffffed;color:#0d516b;box-shadow:0 4px #008db04d;padding:10px 12px;line-height:1.35;font-size:13px;font-weight:900;display:flex;align-items:center;gap:8px}.message.bad{background:#ffe0dc;color:#ac2a27;animation:shake .28s}.message.good{background:#daf9cf;color:#17623c}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.controls{position:absolute;bottom:0;left:0;right:0;padding:10px 13px calc(14px + env(safe-area-inset-bottom));background:#036e9de8;border-top:4px solid #fff7;min-height:174px}.question{font-size:12px;font-weight:1000;margin:0 0 9px;color:#e4faff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{padding:11px 5px;min-height:56px;font-size:14px;line-height:1.2;touch-action:manipulation}.action:disabled{opacity:.45;filter:grayscale(.6);cursor:default}.action.alt{background:white;color:#056ca1;box-shadow:0 5px #19637c}.steptext{font-weight:900;font-size:13px;margin:3px 0 13px}.sliderWrap{display:flex;align-items:center;gap:13px}.dial{width:76px;height:76px;border-radius:50%;background:conic-gradient(#ffe66d 0 var(--angle,0%),#1d7fa4 var(--angle,0%) 100%);border:6px solid white;display:grid;place-items:center;touch-action:none;box-shadow:0 4px #00445c;position:relative;flex-shrink:0}.dial:after{content:"";position:absolute;inset:8px;border:5px solid #0b78a7;border-radius:50%;background:#dff6ff}.dial span{z-index:1;color:#075b85;font-size:21px;font-weight:1000}.sliderinfo{flex:1;font-weight:900;font-size:13px}.sliderinfo small{display:block;color:#d9f9ff;font-size:11px;margin-top:6px}.gauge{height:12px;border-radius:10px;border:2px solid #fff;background:linear-gradient(90deg,#ffbd52,#ffe77a 28%,#7ecaf6 63%,#0f7be4);margin-top:8px;position:relative}.pointer{position:absolute;left:var(--p,0%);width:4px;height:23px;top:-8px;border-radius:5px;background:white;box-shadow:0 0 0 2px #045f88;transform:translateX(-50%)}.miniActions{display:flex;gap:8px;margin-top:10px}.miniActions button{flex:1}.end{padding:155px 20px 15px;text-align:center;overflow:auto;height:100%}.end h1{font-size:33px;text-shadow:3px 3px #056b92;margin:8px 0}.bigscore{font-weight:1000;font-size:65px;line-height:1;color:var(--yellow);text-shadow:0 4px #0c7ba0}.review{background:#fff;color:#164b65;text-align:left;border-radius:20px;padding:14px;margin:14px 0;max-height:30dvh;overflow:auto;box-shadow:0 5px #047a9b}.review p{font-size:12px;margin:6px 0 10px;line-height:1.5}.review strong{color:#bd4e35}.next{margin:15px auto;width:100%;max-width:340px}.feedbackOverlay{position:absolute;inset:0;z-index:9;background:#033c61c9;display:none;place-items:center;padding:25px}.feedbackOverlay.show{display:grid}.feedbackCard{width:100%;max-width:340px;background:#fff;color:#0a506d;padding:22px 18px;border-radius:25px;text-align:center;box-shadow:0 10px 0 #00384c}.feedbackCard h2{margin:3px 0 6px;font-size:27px;color:var(--good)}.feedbackCard p{font-size:14px;font-weight:800;line-height:1.6}.feedbackCard .action{width:100%;margin-top:10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* iPhone Safari: controls-first fluid viewport layout */
#app{height:100svh;height:100dvh;min-height:0;}
.screen.active.game{display:flex;flex-direction:column;padding-top:clamp(112px,16dvh,149px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;min-height:0;scrollbar-width:none;}

@media(max-height:750px){.screen.active.game{padding-top:116px}.game .task h2{font-size:17px}.game .controls .action{min-height:44px}.game .controls .dial{width:66px;height:66px}.game .message{min-height:37px}.game .labArea{min-height:65px}}

<body><div id="app">
<div class="decor" aria-hidden="true"><div class="sun"></div><div class="cloud"></div><div class="cloud c2"></div><div class="wave"></div><div class="wave w2"></div><div class="bubbles"><span style="--x:13%;--t:9s;--d:-2s"></span><span style="--x:70%;--t:7s;--d:-4s"></span><span style="--x:35%;--t:11s;--d:-6s"></span><span style="--x:82%;--t:8s;--d:-1s"></span></div></div>
<header><div class="hudrow"><div><div class="little">おきなわ理科チャレンジ</div><div class="score" id="score">0000</div><div class="little" id="best">ベスト 0000</div></div><button class="mute" id="sound" aria-label="おとの切り替え">♪ おと ON</button></div><div class="pills" id="pills"><span class="pill on">① 点火</span><span class="pill">② 調節</span><span class="pill">③ 消火</span></div></header>
<section id="title" class="screen titleScreen active"><span class="tag">⚗ さわって学ぶ実験ゲーム</span><h1>ガスバーナー<br><em>名人！</em></h1><p class="subtitle">ねじをまわして、青い炎をつくろう！</p><div class="hero" id="hero"></div><button class="startBtn" id="start">▶ じっけん開始！</button><p class="caption">3ステージ ・ 約2分 ・ 何度でも挑戦！</p><p class="safety">※これは学習用シミュレーションです。実物の操作は必ず先生の指導で行いましょう。</p></section>
<section id="game" class="screen game"><div class="task"><span class="timer" id="timer">45秒</span><div class="kicker" id="phase">ステージ 1 / 3</div><h2 id="tasktitle">点火しよう！</h2><p id="taskdesc">安全な順番を選ぼう</p></div><div class="labArea" id="labArea"><span class="note" id="flameNote">火が消えているよ</span><div id="labImage" style="height:100%;width:100%;display:grid;place-items:center"></div></div><div class="message" id="message" role="status" aria-live="polite">何から始めるかな？</div><div class="controls" id="controls"></div></section>
<section id="end" class="screen end"><span class="tag">実験おわり！</span><h1>実験レポート</h1><div class="bigscore" id="finalScore">0</div><p style="font-weight:900">点 / ベスト <span id="finalBest">0</span>点</p><div id="ending" style="font-weight:900;color:#0b5571"></div><div class="review" id="review"></div><button class="startBtn next" id="again">▶ もう一度あそぶ</button><button class="action alt" style="width:100%;max-width:300px" id="home">タイトルへ</button></section>
<div class="feedbackOverlay" id="overlay"><div class="feedbackCard"><div style="font-size:30px" id="overlayIcon">◎</div><h2 id="overlayTitle">クリア！</h2><p id="overlayText"></p><button class="action" id="continue">つぎへ ▶</button></div></div>
</div>
<script>
(()=>{'use strict';
const $=q=>document.querySelector(q);let stage=-1,step=0,score=0,time=45,timer=null,locked=false,sound=true,actx=null,errors=[],stageDone=[false,false,false],air=0,lit=false,gas=false,cock=false,match=false,slides=0;
const STAGES=[{title:'点火しよう！',desc:'安全な手順を選んで、炎をつけよう。',why:'調節ねじが閉じていることを確認し、火のついたマッチを先に近づけてから、ガスを少しずつ出す。'},{title:'青い炎をつくろう！',desc:'空気調節ねじを動かして、適切な炎に。',why:'空気を取り込む量を増やすと、燃焼がより完全になり、青い炎になる。空気の入れすぎにも注意。'},{title:'安全に消火しよう！',desc:'閉める順番を守って、実験を終了。',why:'空気調節ねじ、ガス調節ねじ、ガスの元栓・コックを安全な順で閉める。学校の器具や先生の指示を優先する。'}];
function storageGet(){try{return +(localStorage.getItem('burner-v2-best')||0)}catch(e){return 0}}function storageSet(v){try{localStorage.setItem('burner-v2-best',String(v))}catch(e){}}
function wakeSound(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(actx?.state==='suspended')actx.resume().catch(()=>{})}
function beep(good=true){if(!sound)return;wakeSound();if(!actx)return;try{let o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='sine';o.frequency.setValueAtTime(good?570:220,t);o.frequency.exponentialRampToValueAtTime(good?800:170,t+.1);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.17)}catch(e){}}
function svg(airVal=0,on=false){let blue=airVal>=48, color=blue?'#33aaff':'#ffbc42',inner=blue?'#8ce9ff':'#fff0a0',h=on?(blue?100:136):0;return `<svg class="labsvg" viewBox="0 0 320 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ガスバーナーの模式図"><ellipse cx="160" cy="284" rx="116" ry="15" fill="#08536b" opacity=".23"/><path d="M50 266h220l-27 20H77z" fill="#325f77" stroke="#19475e" stroke-width="5"/><path d="M134 262h52v-163h-52z" fill="#dfeff4" stroke="#225e80" stroke-width="5"/><rect x="129" y="175" width="62" height="45" rx="8" fill="#79abb9" stroke="#22637e" stroke-width="5"/><path d="M129 181h62m-62 25h62" stroke="#306b82" stroke-width="4"/><path d="M139 95h42v-12h-42z" fill="#255773"/><path d="M160 261v-46" stroke="#4e8799" stroke-width="7"/><path d="M191 234h44q10 0 10 10v9" fill="none" stroke="#f7cb55" stroke-width="10"/><path d="M245 252q25 0 44 18" stroke="#f5cd59" stroke-width="10" fill="none"/><rect x="111" y="229" width="94" height="20" rx="10" fill="#b3e3e8" stroke="#28627a" stroke-width="4"/><circle cx="208" cy="239" r="14" fill="#f7d96b" stroke="#145579" stroke-width="4"/><circle cx="108" cy="193" r="13" fill="#f7d96b" stroke="#145579" stroke-width="4"/><path d="M108 184v9m100 38v10" stroke="#1a6c88" stroke-width="4" stroke-linecap="round"/>${h?`<g class="flameY" style="transform-origin:160px 91px"><path d="M160 ${94-h}Q${119+(blue?12:0)} ${54-h/3} 139 95 Q151 118 160 115 Q181 113 182 88 Q207 58 160 ${94-h}Z" fill="${color}"/><path d="M160 ${116-h*.6}Q146 80 148 100Q153 115 160 115Q173 115 173 102Q175 87 160 ${116-h*.6}Z" fill="${inner}" opacity=".92"/></g>`:''}<g fill="#fff" stroke="#0b658a" stroke-width="3"><circle cx="66" cy="242" r="25"/><circle cx="262" cy="242" r="25"/></g><g fill="#08536b" font-size="10" text-anchor="middle" font-weight="bold"><text x="66" y="238">空気</text><text x="66" y="251">ねじ</text><text x="262" y="238">ガス</text><text x="262" y="251">ねじ</text></g></svg>`}
function show(name){for(const s of ['title','game','end'])$('#'+s).classList.toggle('active',s===name)}function setHud(){ $('#score').textContent=String(score).padStart(4,'0');$('#best').textContent='ベスト '+String(Math.max(storageGet(),score)).padStart(4,'0');$('#pills').innerHTML=['① 点火','② 調節','③ 消火'].map((s,i)=>`<span class="pill ${stageDone[i]?'done':i===stage?'on':''}">${s}</span>`).join('')}
function draw(){const el=stage===-1?$('#hero'):$('#labImage');el.innerHTML=svg(air,lit);if(stage>=0){$('#flameNote').textContent=lit?(air>=48?'青い炎になった！':'黄色い炎だよ'):'火が消えているよ'}}
function say(text,kind=''){const el=$('#message');el.className='message '+kind;el.textContent=text}
function addError(text){errors.push({stage,text});score=Math.max(0,score-10);setHud();beep(false);say('ちがうよ！ '+text,'bad')}
function correct(text){score+=100+Math.ceil(time/3);beep(true);say(text,'good');setHud()}
function begin(){wakeSound();score=0;errors=[];stageDone=[false,false,false];stage=0;beginStage()}
function beginStage(){clearInterval(timer);step=0;time=45;locked=false;show('game');$('#phase').textContent=`ステージ ${stage+1} / 3`;$('#tasktitle').textContent=STAGES[stage].title;$('#taskdesc').textContent=STAGES[stage].desc;air=stage===0?0:stage===1?12:70;lit=stage!==0;gas=stage!==0;cock=stage!==0;match=false;slides=0;renderControls();draw();setHud();say(stage===0?'まず、安全を確認しよう！':stage===1?'空気調節ねじを動かそう！':'安全な順番で消火しよう！');$('#timer').textContent=time+'秒';timer=setInterval(()=>{if(locked)return;time--;$('#timer').textContent=time+'秒';if(time<=0){addError('時間切れ。正しい手順を復習しよう。');finishStage(false)}},1000)}
const ignition=[{id:'check',label:'① ねじを確認',explain:'ガス・空気のねじが閉じているか確認。'},{id:'match',label:'② マッチを点火',explain:'マッチに火をつけ、バーナーの口へ近づける。'},{id:'cock',label:'③ コックを開く',explain:'マッチの火を近づけたまま、コックを開く。'},{id:'gas',label:'④ ガスを少し出す',explain:'ガス調節ねじを少し開き、点火する。'}];
const extinguish=[{id:'air',label:'① 空気を閉じる',explain:'空気調節ねじを閉じる。'},{id:'gas',label:'② ガスを閉じる',explain:'ガス調節ねじを閉じて炎を消す。'},{id:'cock',label:'③ コックを閉じる',explain:'コックと元栓を閉じる。'}];
function renderControls(){let box=$('#controls');if(stage===1){box.innerHTML=`<p class="question">空気ねじをドラッグ！ 青い炎の範囲をねらおう。</p><div class="sliderWrap"><div id="dial" class="dial" role="slider" tabindex="0" aria-label="空気調節ねじ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${air}" style="--angle:${air}%"><span>↻</span></div><div class="sliderinfo">空気の量：<span id="airLabel">${air}%</span><div class="gauge" id="gauge" style="--p:${air}%"><span class="pointer"></span></div><small>左：黄色い炎　→　右：青い炎</small></div></div><div class="miniActions"><button class="action" id="judge">この炎で決定！</button><button class="action alt" id="hint">ヒント</button></div>`;let dial=$('#dial');function dialChange(e){const r=dial.getBoundingClientRect();const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);let degrees=(Math.atan2(y,x)*180/Math.PI+450)%360;const value=Math.round(degrees/360*100);adjust(value)}dial.addEventListener('pointerdown',e=>{if(locked)return;dial.setPointerCapture(e.pointerId);dialChange(e);beep(true)});dial.addEventListener('pointermove',e=>{if(locked||!dial.hasPointerCapture(e.pointerId))return;dialChange(e)});dial.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){adjust(Math.min(100,air+5));e.preventDefault()}if(e.key==='ArrowLeft'||e.key==='ArrowDown'){adjust(Math.max(0,air-5));e.preventDefault()}});$('#judge').addEventListener('pointerup',()=>{if(locked)return;if(air>=60&&air<=85){correct('正解！ 空気の量を調節し、青い炎にできたね。');finishStage(true)}else addError(air<60?'空気が少なく、黄色い炎が残っているよ。':'空気の取り込みが多すぎるよ。少し戻してみよう。')});$('#hint').addEventListener('pointerup',()=>say('炎の色を見て。黄色から青色へ変わる位置を探そう。'));return}
let list=stage===0?ignition:extinguish;box.innerHTML=`<p class="question">${stage===0?'次にする操作を選ぼう！':'次に閉じるものを選ぼう！'}</p><div class="steptext">進み具合：<span id="steplabel">${step}</span> / ${list.length}</div><div class="choices">${[...list].sort((a,b)=>({check:2,match:4,cock:1,gas:3,air:2}[a.id]||0)-({check:2,match:4,cock:1,gas:3,air:2}[b.id]||0)).map(x=>`<button class="action" data-action="${x.id}">${x.label.replace(/^\S+ /,'')}</button>`).join('')}</div>`;box.querySelectorAll('button').forEach(b=>b.addEventListener('pointerup',()=>choose(b.dataset.action)))}
function adjust(v){air=v;$('#airLabel').textContent=v+'%';$('#gauge').style.setProperty('--p',v+'%');$('#dial').style.setProperty('--angle',v+'%');$('#dial').setAttribute('aria-valuenow',String(v));draw()}
function choose(id){if(locked)return;let list=stage===0?ignition:extinguish,need=list[step];if(!need)return;if(id!==need.id){addError(stage===0?'順番が違うよ。'+need.explain:need.explain+' が先だよ。');return}step++;$('#steplabel').textContent=step;beep(true);if(stage===0){if(id==='match')match=true;if(id==='cock')cock=true;if(id==='gas'){gas=true;lit=true;air=0}}else{if(id==='air')air=0;if(id==='gas'){gas=false;lit=false}if(id==='cock')cock=false}draw();score+=35;setHud();say(need.explain,'good');if(step===list.length){score+=Math.ceil(time/2);setHud();finishStage(true)}}
function finishStage(success){if(locked)return;locked=true;clearInterval(timer);stageDone[stage]=success;$('#overlayIcon').textContent=success?'✨':'📖';$('#overlayTitle').textContent=success?'ステージクリア！':'ここで復習！';$('#overlayTitle').style.color=success?'#167d66':'#b94737';$('#overlayText').textContent=STAGES[stage].why;$('#continue').textContent=stage===2?'結果を見る ▶':'つぎへ ▶';$('#overlay').classList.add('show');if(success)beep(true)}
function next(){if(!locked)return;$('#overlay').classList.remove('show');if(stage<2){stage++;beginStage()}else finishGame()}
function finishGame(){clearInterval(timer);show('end');let best=storageGet();if(score>best){best=score;storageSet(score)}$('#finalScore').textContent=score;$('#finalBest').textContent=best;$('#ending').textContent=errors.length?'間違えた理由を確認して、もう一度挑戦！':'全ステージ完了！ 実験の安全名人だね！';$('#review').innerHTML='<strong>📘 きょうの復習</strong>'+STAGES.map((x,i)=>`<p><b>${i+1}. ${x.title}</b>　${stageDone[i]?'✓':'要復習'}<br>${x.why}</p>`).join('')+(errors.length?`<strong>見直しポイント（${errors.length}件）</strong>`+errors.slice(0,8).map(x=>`<p>・${x.text}</p>`).join(''):'<p>ノーミス！ 手順の理由も言葉で説明できるかな？</p>');setHud()}
$('#start').addEventListener('pointerup',begin);$('#again').addEventListener('pointerup',begin);$('#home').addEventListener('pointerup',()=>{clearInterval(timer);stage=-1;lit=true;air=70;draw();show('title');setHud()});$('#continue').addEventListener('pointerup',next);$('#sound').addEventListener('pointerup',()=>{sound=!sound;$('#sound').textContent=sound?'♪ おと ON':'♪ おと OFF';if(sound)beep(true)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&stage>=0&&!locked&&$('#game').classList.contains('active')){clearInterval(timer);say('画面を戻したら、操作を続けよう。');}else if(!document.hidden&&stage>=0&&!locked&&$('#game').classList.contains('active')){clearInterval(timer);timer=setInterval(()=>{time--;$('#timer').textContent=time+'秒';if(time<=0){addError('時間切れ。正しい手順を復習しよう。');finishStage(false)}},1000)}});
lit=true;air=70;draw();setHud();
})();
</script></body></html>

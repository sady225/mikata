ow:visible}.labArea .flameY{transform-origin:50% 100%;animation:flicker .75s ease-in-out infinite alternate}.labArea .flameB{transform-origin:50% 100%;animation:flicker .5s ease-in-out infinite alternate}@keyframes flicker{to{transform:scale(.9,1.08) rotate(2deg)}}@keyframes bob{50%{transform:translateY(-6px)}}.note{position:absolute;z-index:1;top:9px;right:13px;color:#08516c;font-size:11px;font-weight:900;background:#ffffffda;padding:6px 9px;border-radius:20px}.message{min-height:53px;margin:2px 14px 7px;border-radius:15px;background:#ffffffed;color:#0d516b;box-shadow:0 4px #008db04d;padding:10px 12px;line-height:1.35;font-size:13px;font-weight:900;display:flex;align-items:center;gap:8px}.message.bad{background:#ffe0dc;color:#ac2a27;animation:shake .28s}.message.good{background:#daf9cf;color:#17623c}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.controls{position:absolute;bottom:0;left:0;right:0;padding:10px 13px calc(14px + env(safe-area-inset-bottom));background:#036e9de8;border-top:4px solid #fff7;min-height:174px}.question{font-size:12px;font-weight:1000;margin:0 0 9px;color:#e4faff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{padding:11px 5px;min-height:56px;font-size:14px;line-height:1.2;touch-action:manipulation}.action:disabled{opacity:.45;filter:grayscale(.6);cursor:default}.action.alt{background:white;color:#056ca1;box-shadow:0 5px #19637c}.steptext{font-weight:900;font-size:13px;margin:3px 0 13px}.sliderWrap{display:flex;align-items:center;gap:13px}.dial{width:76px;height:76px;border-radius:50%;background:conic-gradient(#ffe66d 0 var(--angle,0%),#1d7fa4 var(--angle,0%) 100%);border:6px solid white;display:grid;place-items:center;touch-action:none;box-shadow:0 4px #00445c;position:relative;flex-shrink:0}.dial:after{content:"";position:absolute;inset:8px;border:5px solid #0b78a7;border-radius:50%;background:#dff6ff}.dial span{z-index:1;color:#075b85;font-size:21px;font-weight:1000}.sliderinfo{flex:1;font-weight:900;font-size:13px}.sliderinfo small{display:block;color:#d9f9ff;font-size:11px;margin-top:6px}.gauge{height:12px;border-radius:10px;border:2px solid #fff;background:linear-gradient(90deg,#ffbd52,#ffe77a 28%,#7ecaf6 63%,#0f7be4);margin-top:8px;position:relative}.pointer{position:absolute;left:var(--p,0%);width:4px;height:23px;top:-8px;border-radius:5px;background:white;box-shadow:0 0 0 2px #045f88;transform:translateX(-50%)}.miniActions{display:flex;gap:8px;margin-top:10px}.miniActions button{flex:1}.end{padding:155px 20px 15px;text-align:center;overflow:auto;height:100%}.end h1{font-size:33px;text-shadow:3px 3px #056b92;margin:8px 0}.bigscore{font-weight:1000;font-size:65px;line-height:1;color:var(--yellow);text-shadow:0 4px #0c7ba0}.review{background:#fff;color:#164b65;text-align:left;border-radius:20px;padding:14px;margin:14px 0;max-height:30dvh;overflow:auto;box-shadow:0 5px #047a9b}.review p{font-size:12px;margin:6px 0 10px;line-height:1.5}.review strong{color:#bd4e35}.next{margin:15px auto;width:100%;max-width:340px}.feedbackOverlay{position:absolute;inset:0;z-index:9;background:#033c61c9;display:none;place-items:center;padding:25px}.feedbackOverlay.show{display:grid}.feedbackCard{width:100%;max-width:340px;background:#fff;color:#0a506d;padding:22px 18px;border-radius:25px;text-align:center;box-shadow:0 10px 0 #00384c}.feedbackCard h2{margin:3px 0 6px;font-size:27px;color:var(--good)}.feedbackCard p{font-size:14px;font-weight:800;line-height:1.6}.feedbackCard .action{width:100%;margin-top:10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* iPhone Safari: controls-first fluid viewport layout */
#app{height:100svh;height:100dvh;min-height:0;}
.screen.active.game{display:flex;flex-direction:column;padding-top:clamp(112px,16dvh,149px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;min-height:0;scrollbar-width:none;}

.game .labArea svg{height:100%;max-height:100%;width:100%;overflow:hidden}
.game .message{flex:0 0 auto;min-height:43px;padding:7px 11px;margin:3px 12px 6px;font-size:12px}
.game .controls{position:sticky;bottom:0;z-index:5;flex:0 0 auto;min-height:0;margin-top:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
.game .controls .action{min-height:48px;padding:9px 5px}
.game .controls .choices{gap:8px}
.game .controls .question{margin-bottom:7px}
.game .controls .steptext{margin:2px 0 8px}
.titleScreen.active,.end.active{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.titleScreen .hero{min-height:120px;height:clamp(130px,28dvh,260px)}
@media(max-height:750px){.screen.active.game{padding-top:116px}.game .task h2{font-size:17px}.game .controls .action{min-height:44px}.game .controls .dial{width:66px;height:66px}.game .message{min-height:37px}.game .labArea{min-height:65px}}
@media(max-height:610px){.screen.active.game{padding-top:112px}.game .task p{font-size:11px}.game .labArea{min-height:55px}.titleScreen.active{padding-top:124px}}

/* iPhone 17 / Dynamic Island safe-area header repair */
:root{--ui-safe-top:env(safe-area-inset-top,0px);}
#app{padding-top:0;}
#app>header{
  top:0;
  height:calc(140px + var(--ui-safe-top));

}
#app>header .hudrow{min-height:67px;align-items:flex-start;}

/* Stage 1: step-linked equipment motion */
@keyframes flameLight{0%{opacity:0;transform:scale(.3,.08)}45%{opacity:1;transform:scale(.65,.6)}100%{opacity:1;transform:scale(1)}}
.ignite-rise{transform-origin:160px 85px;animation:flameLight .65s cubic-bezier(.2,.85,.3,1.1) both}

@keyframes matchApproach{from{transform:translate(115px,48px);opacity:0}to{transform:translate(0,0);opacity:1}}
@keyframes knobTurn{from{transform:rotate(0deg)}to{transform:rotate(80deg)}}
@keyframes cockTurn{from{transform:rotate(0deg)}to{transform:rotate(75deg)}}
@keyframes checkPulse{0%{opacity:0;transform:scale(.88)}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
@keyframes sparkPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.match-enter{animation:matchApproach .75s ease-out both;transform-box:fill-box}
.gas-turn{animation:knobTurn .65s ease-out both}
.cock-turn{animation:cockTurn .65s ease-out both;transform-origin:0 0}
.check-pop{animation:checkPulse .6s ease-out both;transform-origin:160px 215px}
.spark-pop{animation:sparkPop .45s ease-out both;transform-origin:160px 83px}
@media(prefers-reduced-motion:reduce){.match-enter,.gas-turn,.cock-turn,.check-pop,.spark-pop{animation-duration:.01ms}}

/* Stage 3: each closing action animates its corresponding equipment */
@keyframes extAirTurn{from{transform:rotate(0deg)}to{transform:rotate(-115deg)}}
@keyframes extGasTurn{from{transform:rotate(0deg)}to{transform:rotate(-110deg)}}
@keyframes extCockTurn{from{transform:rotate(0deg)}to{transform:rotate(-90deg)}}
@keyframes extFocus{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
@keyframes extFlameOff{0%,15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.2,.08)}}
.ext-air-turn,.ext-gas-turn,.ext-cock-turn{transform-origin:0 0;animation-duration:.65s;animation-timing-function:ease-out;animation-fill-mode:forwards}
.ext-air-turn{animation-name:extAirTurn}
.ext-gas-turn{animation-name:extGasTurn}
.ext-cock-turn{animation-name:extCockTurn}
.ext-focus{animation:extFocus .35s ease-out both;transform-origin:center}
.ext-flame-out{animation:extFlameOff .7s ease-in both}
@media(prefers-reduced-motion:reduce){.ext-air-turn,.ext-gas-turn,.ext-cock-turn,.ext-focus,.ext-flame-out{animation-duration:.01ms}}

/* Stage 2: visible air-control movement and iPhone-friendly input */
.airControl{background:#ffffff1a;border:2px solid #ffffff75;border-radius:17px;padding:8px 10px 9px}
.airHelp,.airScale{display:flex;align-items:center;justify-content:space-between;gap:8px}
.airHelp{font-size:12px;font-weight:900;margin-bottom:6px}.airHelp strong{color:#ffe66d}
.airAdjust{display:flex;align-items:center;gap:9px}
.airNudge{height:46px;width:48px;min-width:48px;border-radius:13px;border:2px solid white;background:#ffe66d;color:#064767;font-size:27px;font-weight:1000}
.airNudge:active{transform:scale(.96)}
.airRange{appearance:none;-webkit-appearance:none;flex:1;width:100%;height:30px;min-width:0;background:transparent;touch-action:pan-x;cursor:pointer}
.airRange::-webkit-slider-runnable-track{height:14px;border:2px solid #fff;border-radius:15px;background:linear-gradient(to right,#ffda67 0%,#ffda67 var(--air-progress,12%),#0a70a3 var(--air-progress,12%),#0a70a3 100%)}
.airRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;margin-top:-11px;border-radius:50%;border:4px solid #fff;background:#ffef8b;box-shadow:0 2px 0 #004769}
.airRange::-moz-range-track{height:14px;border:2px solid #fff;border-radius:15px;background:#0a70a3}
.airRange::-moz-range-thumb{height:27px;width:27px;border:4px solid #fff;border-radius:50%;background:#ffef8b}
.airScale{font-size:10px;font-weight:900;margin-top:2px}.airScale strong{font-size:15px;color:#ffe66d}.airHelpSmall{font-size:10px;text-align:center;color:#e8fbff;font-weight:800;margin-top:4px}
.air-flow{animation:airPuff 1.1s ease-in-out infinite alternate}
@keyframes airPuff{from{opacity:.35}to{opacity:1}}
@media(max-height:750px){.airControl{padding:6px 8px}.airNudge{height:40px;width:43px;min-width:43px}.airHelpSmall{display:none}}
@media(prefers-reduced-motion:reduce){.air-flow{animation:none}}
</style>

<script>

function storageGet(){try{return +(localStorage.getItem('burner-v2-best')||0)}catch(e){return 0}}function storageSet(v){try{localStorage.setItem('burner-v2-best',String(v))}catch(e){}}
function wakeSound(){if(!actx)try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}if(actx?.state==='suspended')actx.resume().catch(()=>{})}
function beep(good=true){if(!sound)return;wakeSound();if(!actx)return;try{let o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='sine';o.frequency.setValueAtTime(good?570:220,t);o.frequency.exponentialRampToValueAtTime(good?800:170,t+.1);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.17)}catch(e){}}
function ignitionSound(){
 if(!sound)return;
 wakeSound();if(!actx)return;
 try{
  const t=actx.currentTime,osc=actx.createOscillator(),gain=actx.createGain();
  osc.type='triangle';osc.frequency.setValueAtTime(165,t);
  osc.frequency.exponentialRampToValueAtTime(72,t+.42);
  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(.055,t+.07);
  gain.gain.exponentialRampToValueAtTime(.0001,t+.48);
  osc.connect(gain);gain.connect(actx.destination);osc.start(t);osc.stop(t+.5);
  const len=Math.floor(actx.sampleRate*.65),buffer=actx.createBuffer(1,len,actx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  const noise=actx.createBufferSource(),filter=actx.createBiquadFilter(),ng=actx.createGain();
  noise.buffer=buffer;filter.type='lowpass';filter.frequency.value=650;
  ng.gain.setValueAtTime(.0001,t);
  ng.gain.exponentialRampToValueAtTime(.12,t+.09);
  ng.gain.exponentialRampToValueAtTime(.0001,t+.6);
  noise.connect(filter);filter.connect(ng);ng.connect(actx.destination);
  noise.start(t);noise.stop(t+.65);
 }catch(e){}
}
function extinguishSound(kind){
 if(!sound)return;wakeSound();if(!actx)return;
 try{
 const t=actx.currentTime;
 const osc=actx.createOscillator(),gain=actx.createGain();
 osc.type=kind==='gas'?'triangle':'sine';
 const f=kind==='air'?340:kind==='gas'?200:540;
 osc.frequency.setValueAtTime(f,t);
 osc.frequency.exponentialRampToValueAtTime(kind==='gas'?75:kind==='cock'?260:200,t+.26);
 gain.gain.setValueAtTime(.0001,t);
 gain.gain.exponentialRampToValueAtTime(kind==='air'?.035:.065,t+.02);
 gain.gain.exponentialRampToValueAtTime(.0001,t+.32);
 osc.connect(gain);gain.connect(actx.destination);osc.start(t);osc.stop(t+.34);
 if(kind==='gas'){
  const duration=.38,n=Math.floor(actx.sampleRate*duration),buffer=actx.createBuffer(1,n,actx.sampleRate),d=buffer.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=actx.createBufferSource(),lp=actx.createBiquadFilter(),g=actx.createGain();
  src.buffer=buffer;lp.type='lowpass';lp.frequency.value=540;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  src.connect(lp);lp.connect(g);g.connect(actx.destination);src.start(t);src.stop(t+duration);
 }
 }catch(e){}
}

function show(name){for(const s of ['title','game','end'])$('#'+s).classList.toggle('active',s===name)}function setHud(){ $('#score').textContent=String(score).padStart(4,'0');$('#best').textContent='ベスト '+String(Math.max(storageGet(),score)).padStart(4,'0');$('#pills').innerHTML=['① 点火','② 調節','③ 消火'].map((s,i)=>`<span class="pill ${stageDone[i]?'done':i===stage?'on':''}">${s}</span>`).join('')}
function draw(){const el=stage===-1?$('#hero'):$('#labImage');el.innerHTML=svg(air,lit);if(stage>=0){$('#flameNote').textContent=lit?(air>=48?'青い炎になった！':'黄色い炎だよ'):'火が消えているよ'}}

function correct(text){score+=100+Math.ceil(time/3);beep(true);say(text,'good');setHud()}
function begin(){wakeSound();score=0;errors=[];stageDone=[false,false,false];stage=0;beginStage()}
function beginStage(){clearInterval(timer);step=0;time=45;locked=false;show('game');$('#phase').textContent=`ステージ ${stage+1} / 3`;$('#tasktitle').textContent=STAGES[stage].title;$('#taskdesc').textContent=STAGES[stage].desc;air=stage===0?0:stage===1?12:70;lit=stage!==0;gas=stage!==0;cock=stage!==0;match=false;slides=0;ignitionVisual='start';ignitionBusy=false;extinguishVisual='start';stepBusy=false;renderControls();draw();setHud();say(stage===0?'まず、安全を確認しよう！':stage===1?'空気調節ねじを動かそう！':'安全な順番で消火しよう！');$('#timer').textContent=time+'秒';timer=setInterval(()=>{if(locked||ignitionBusy||stepBusy)return;time--;$('#timer').textContent=time+'秒';if(time<=0){addError('時間切れ。正しい手順を復習しよう。');finishStage(false)}},1000)}
const ignition=[{id:'check',label:'① ねじを確認',explain:'ガス・空気のねじが閉じているか確認。'},{id:'match',label:'② マッチを点火',explain:'マッチに火をつけ、バーナーの口へ近づける。'},{id:'cock',label:'③ コックを開く',explain:'マッチの火を近づけたまま、コックを開く。'},{id:'gas',label:'④ ガスを少し出す',explain:'ガス調節ねじを少し開き、点火する。'}];
const extinguish=[{id:'air',label:'① 空気を閉じる',explain:'空気調節ねじを閉じる。'},{id:'gas',label:'② ガスを閉じる',explain:'ガス調節ねじを閉じて炎を消す。'},{id:'cock',label:'③ コックを閉じる',explain:'コックと元栓を閉じる。'}];
function renderControls(){let box=$('#controls');if(stage===1){
 box.innerHTML=`<p class="question">🌀 空気調節ねじを回して、炎の色を変えよう！</p>

  say('ガス調節ねじを閉じて、炎を消すよ。','good');
  draw();
  setTimeout(()=>{if(stage!==activeStage||locked)return;gas=false;lit=false;draw();say('フッ。ガスを止めたので炎が消えたよ。','good');stepBusy=false},750);
 }else if(id==='cock'){
  cock=false;draw();say('カチッ。コックを閉じたよ。元栓も確認して実験終了！','good');
  setTimeout(()=>{if(stage!==activeStage||locked)return;stepBusy=false;score+=Math.ceil(time/2);setHud();finishStage(true)},1450);
 }

}
draw();score+=35;setHud();say(need.explain,'good');
if(step===list.length){score+=Math.ceil(time/2);setHud();finishStage(true)}}
function finishStage(success){if(locked)return;locked=true;clearInterval(timer);stageDone[stage]=success;$('#overlayIcon').textContent=success?'✨':'📖';$('#overlayTitle').textContent=success?'ステージクリア！':'ここで復習！';$('#overlayTitle').style.color=success?'#167d66':'#b94737';$('#overlayText').textContent=STAGES[stage].why;$('#continue').textContent=stage===2?'結果を見る ▶':'つぎへ ▶';$('#overlay').classList.add('show');if(success)beep(true)}

<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b452f">
<title>喜名番所 おしごと大作戦！</title>
<style>
:root{--wood:#5b452f;--gold:#f2cf68;--paper:#fffaf0;--ink:#302820;--green:#5e8a61;--red:#b45d53;--blue:#658da1;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2c251f}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;touch-action:manipulation}
#app{width:min(100vw,480px);height:100vh;height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#b9d9d5,#e6ddbd 52%,#d2ae78);user-select:none}
header{position:absolute;z-index:20;inset:0 0 auto;height:78px;padding:8px 10px;background:linear-gradient(#71543a,#523d2d);color:#fff;border-bottom:3px solid #c99b52}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:9px;font-weight:1000}.day{font-size:11px;font-weight:1000;background:#ffffff20;border-radius:999px;padding:5px 8px}.hud{display:flex;gap:5px}.hud span,.hud button{border:0;border-radius:999px;background:#fff;color:#5e452f;min-height:30px;padding:6px 9px;font-size:10px;font-weight:1000}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.meter{height:7px;border-radius:99px;background:#ffffff25;overflow:hidden}.meter i{display:block;height:100%;width:100%;background:#82c58e;transition:.2s}.meter.time i{background:#f0ce68}
.screen{position:absolute;inset:0;display:none}.screen.active{display:flex}
.title{padding:90px 18px 16px;flex-direction:column;align-items:center;justify-content:center;text-align:center}.badge{background:#fff;padding:7px 14px;border-radius:999px;color:#634a34;font-size:11px;font-weight:1000}.title h1{font-size:clamp(34px,9vw,46px);line-height:1.02;color:#fff;text-shadow:0 4px #5e4632;margin:12px 0 4px}.title h1 em{font-style:normal;color:#f4d36f}.title p{font-size:13px;font-weight:900;color:#5d4734;margin:0}.hero{height:min(29dvh,220px);min-height:145px;width:min(84vw,320px);display:grid;place-items:center}
.start,.next,.retry,.small{border:0;border-radius:999px;background:var(--gold);color:#684718;font-weight:1000;box-shadow:0 5px #ad8034,0 0 0 3px #fff inset}.start{width:min(88vw,330px);min-height:54px;font-size:19px}.start:active,.next:active,.retry:active,.small:active{transform:translateY(3px);box-shadow:0 2px #ad8034,0 0 0 3px #fff inset}.title small{max-width:340px;margin-top:9px;color:#654c39;font-size:10px;line-height:1.45;font-weight:800}
.game{flex-direction:column;padding-top:84px}.mission{margin:5px 8px;background:#fff;border-radius:17px;padding:7px 10px;box-shadow:0 4px #60482d28;flex:0 0 auto}.mission b{font-size:9px;color:#91613f}.mission h2{font-size:15px;margin:2px 0}.mission p{font-size:9px;color:#76685b;font-weight:800;margin:0;line-height:1.3}
.board{position:relative;flex:1 1 auto;min-height:250px;margin:0 8px 5px;border:3px solid #ffffffbb;border-radius:22px;background:#f7f1e4;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(#bcdad7 0 58%,#c8aa79 58%)}
.road{position:absolute;left:-8%;right:-8%;bottom:3%;height:20%;background:#b18e60;border-top:3px solid #94744b;transform:rotate(-2deg)}
.mainHouse{position:absolute;left:31%;bottom:22%;width:38%;height:39%;background:#8e704c;border:5px solid #5a4634}.roof{position:absolute;left:25%;bottom:58%;width:50%;height:18%;background:#68675f;clip-path:polygon(7% 100%,20% 20%,50% 0,80% 20%,93% 100%)}.door{position:absolute;left:46%;bottom:22%;width:9%;height:26%;background:#44362c}
.zone{position:absolute;z-index:6;width:29%;min-height:54px;border:3px dashed #6e5a43;border-radius:14px;background:#ffffffbd;padding:5px;text-align:center;font-size:10px;font-weight:1000;display:grid;place-items:center}.zone.hotel{left:3%;top:15%}.zone.office{right:3%;top:15%}.zone.guide{left:3%;bottom:7%}.zone.store{right:3%;bottom:7%}
.zone strong{display:block;font-size:20px}.zone.hit{background:#e3f2df}.zone.bad{background:#f8dfdc}
.queue{position:absolute;left:34%;right:34%;top:7%;bottom:6%;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.guest{width:92%;min-height:58px;border-radius:16px;background:#fff;border:3px solid #d5b66d;padding:6px 8px;box-shadow:0 4px #5e463225;display:grid;grid-template-columns:44px 1fr;gap:7px;align-items:center;transition:.2s}.guest .face{font-size:28px;text-align:center}.guest b{font-size:11px}.guest p{font-size:9px;line-height:1.3;margin:2px 0;color:#6b5b50;font-weight:800}.guest.selected{outline:4px solid #f1cf68;transform:scale(1.02)}.guest.waiting{animation:pulse .7s ease-in-out infinite alternate}.guest.done{opacity:.15;transform:scale(.7)}
@keyframes pulse{to{transform:translateY(-2px)}}
.flash{position:absolute;z-index:20;left:50%;top:51%;transform:translate(-50%,-50%);background:#fff;border-radius:18px;padding:11px 13px;max-width:80%;font-size:11px;font-weight:1000;text-align:center;box-shadow:0 5px #0002;opacity:0;pointer-events:none;transition:.18s}.flash.show{opacity:1}
.panel{flex:0 0 auto;background:#574332ea;color:#fff;border-top:3px solid #ffffff6d;padding:7px 8px calc(8px + var(--safe))}
.guideText{text-align:center;font-size:11px;font-weight:1000;margin:0 0 6px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.act{min-height:46px;border:0;border-radius:13px;background:#fff;color:#5c4635;font-size:9px;font-weight:1000;box-shadow:0 4px #35281f;padding:4px}.act strong{display:block;font-size:18px}.act:active{transform:translateY(2px);box-shadow:0 2px #35281f}.status{margin-top:6px;background:#ffffff16;border-radius:10px;padding:6px 8px;font-size:9px;font-weight:900;min-height:28px}
.overlay{position:absolute;z-index:50;inset:0;display:none;place-items:center;padding:17px;background:#2b241ddd}.overlay.show{display:grid}.card{width:100%;max-width:350px;background:#fff;border-radius:23px;padding:17px;text-align:center;box-shadow:0 10px #211a15}.emoji{font-size:38px}.card h2{margin:2px 0 6px;font-size:24px;color:#557a55}.card p{font-size:11px;font-weight:800;line-height:1.55;color:#5d5147}.scoreBox{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.scoreItem{background:#f6efe2;border-radius:13px;padding:8px;font-size:10px;font-weight:1000}.scoreItem strong{display:block;font-size:20px}.next,.retry,.small{width:100%;min-height:46px;margin-top:7px;font-size:14px}.discoverList{list-style:none;padding:0;margin:9px 0;max-height:45dvh;overflow:auto;text-align:left}.discoverList li{font-size:10px;font-weight:800;background:#edf4ee;padding:8px 9px;margin:5px 0;border-radius:11px}.discoverList .locked{background:#f2f2f2;color:#9ba3a5}
@media(max-height:650px){header{height:68px}.game{padding-top:73px}.mission{padding:5px 8px}.mission h2{font-size:13px}.mission p{display:none}.board{min-height:205px}.guest{min-height:52px}.panel{padding-top:5px}.act{min-height:40px}}
@media(max-height:570px){.brand{display:none}.game{padding-top:66px}.board{min-height:175px}.status{display:none}.queue{gap:4px}.guest{min-height:45px;padding:4px}.guest p{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="top">
    <div><div class="brand">子どものMIKATA｜地域文化シミュレーション</div><div id="dayLabel" class="day">1日目</div></div>
    <div class="hud"><span id="rep">⭐ 100</span><button id="collection">🔎 0</button><button id="mute">🔊</button></div>
  </div>
  <div class="meters"><div class="meter"><i id="repBar"></i></div><div class="meter time"><i id="timeBar"></i></div></div>
</header>

<main id="title" class="screen title active">
  <div class="badge">小学4年生向け｜番所を運営しよう</div>
  <h1>喜名番所<br><em>おしごと大作戦！</em></h1>
  <p>昔のホテル＋役場をキミが運営！</p>
  <div class="hero" aria-hidden="true">
    <svg viewBox="0 0 320 210">
      <rect x="69" y="95" width="182" height="83" fill="#8f714c" stroke="#5b4734" stroke-width="6"/>
      <polygon points="52,99 90,48 160,34 232,48 268,99" fill="#68675f"/>
      <rect x="142" y="126" width="38" height="52" fill="#43362c"/>
      <circle cx="63" cy="178" r="15" fill="#d4a17d"/><rect x="52" y="190" width="22" height="16" rx="6" fill="#678797"/>
      <circle cx="256" cy="178" r="15" fill="#d4a17d"/><rect x="245" y="190" width="22" height="16" rx="6" fill="#8a6552"/>
    </svg>
  </div>
  <button id="start" class="start">番所をオープン！</button>
  <small>お客さんの困りごとを見て、宿・役場・道案内・荷物置きへ正しく案内しよう。</small>
</main>

<main id="game" class="screen game">
  <section class="mission">
    <b id="missionNo">1日目</b>
    <h2 id="missionTitle"></h2>
    <p id="missionText"></p>
  </section>

  <section class="board">
    <div class="sky"></div><div class="road"></div><div class="mainHouse"></div><div class="roof"></div><div class="door"></div>
    <button class="zone hotel" data-zone="hotel"><strong>🛏️</strong>宿・休けい</button>
    <button class="zone office" data-zone="office"><strong>📜</strong>村の仕事</button>
    <button class="zone guide" data-zone="guide"><strong>🪧</strong>道案内</button>
    <button class="zone store" data-zone="store"><strong>📦</strong>荷物置き</button>
    <div id="queue" class="queue"></div>
    <div id="flash" class="flash"></div>
  </section>

  <section class="panel">
    <p class="guideText">① お客さんをタップ → ② 行き先をタップ</p>
    <div class="actions">
      <button class="act" data-zone="hotel"><strong>🛏️</strong>休ませる</button>
      <button class="act" data-zone="office"><strong>📜</strong>相談を聞く</button>
      <button class="act" data-zone="guide"><strong>🪧</strong>道を教える</button>
      <button class="act" data-zone="store"><strong>📦</strong>荷物を置く</button>
    </div>
    <div id="status" class="status">お客さんを選ぼう。</div>
  </section>
</main>

<div id="dayClear" class="overlay"><div class="card"><div id="dayEmoji" class="emoji">✨</div><h2 id="dayTitle">1日目クリア！</h2><p id="dayText"></p><div class="scoreBox"><div class="scoreItem">今日の評判<strong id="dayRep">100</strong></div><div class="scoreItem">対応した人<strong id="dayServed">0</strong></div></div><button id="nextDay" class="next">つぎの日へ</button></div></div>
<div id="collectionOverlay" class="overlay"><div class="card"><div class="emoji">🔎</div><h2>番所でわかったこと</h2><ul id="discoverList" class="discoverList"></ul><button id="closeCollection" class="small">もどる</button></div></div>
<div id="finish" class="overlay"><div class="card"><div class="emoji">🏆</div><h2>番所の名スタッフ！</h2><p id="finishText"></p><div class="scoreBox"><div class="scoreItem">最終評判<strong id="finalRep">100</strong></div><div class="scoreItem">全部の対応<strong id="finalServed">0</strong></div></div><button id="showCollection" class="small">わかったことを見る</button><button id="retry" class="retry">もう一回あそぶ</button></div></div>
</div>

<script>
(()=>{
const days=[
 {title:'宿のお仕事をおぼえよう！',text:'旅人を休ませて、荷物もあずかろう。',emoji:'🛏️',
  guests:[
   {face:'🥾',name:'つかれた旅人',say:'「たくさん歩いて、もうクタクタ…」',zone:'hotel',discover:'rest'},
   {face:'📦',name:'荷物を持った旅人',say:'「この荷物、どこに置こう？」',zone:'store',discover:'store'},
   {face:'🥾',name:'もう一人の旅人',say:'「少し休んでから北へ行きたいな」',zone:'hotel',discover:'rest'}
  ],
  clear:'旅人を休ませたり、荷物をあずかったりする「宿場」の仕事がわかった！'},
 {title:'村のお仕事をしよう！',text:'相談や手紙は、村の仕事の場所へ。',emoji:'📜',
  guests:[
   {face:'👨',name:'村の人',say:'「村のことで相談があります」',zone:'office',discover:'admin'},
   {face:'✉️',name:'手紙を持った人',say:'「この手紙を役人に届けたい」',zone:'office',discover:'admin'},
   {face:'🥾',name:'旅人',say:'「今日はここで休みたい」',zone:'hotel',discover:'rest'}
  ],
  clear:'喜名番所は、旅人の宿だけでなく「村の仕事」をする場所でもあった！'},
 {title:'道と人をつなごう！',text:'道を聞く人、荷物を置く人、相談する人が次々来る。',emoji:'🪧',
  guests:[
   {face:'🧭',name:'道に迷った旅人',say:'「国頭へ行く道はどっち？」',zone:'guide',discover:'guide'},
   {face:'📦',name:'荷物を運ぶ人',say:'「いったん荷物を置きたい」',zone:'store',discover:'store'},
   {face:'👵',name:'村のおばぁ',say:'「村のことで話があります」',zone:'office',discover:'admin'},
   {face:'🥾',name:'遠くから来た旅人',say:'「水を飲んで休みたい」',zone:'hotel',discover:'rest'}
  ],
  clear:'喜名は、人・荷物・道・村の仕事が集まる「交通と交流の場所」でもあった！'},
 {title:'大いそがしの日！ 全部の仕事をまわせ',text:'4つのお仕事をまちがえずに全部こなそう。',emoji:'🔥',
  guests:[
   {face:'🥾',name:'旅人',say:'「休ませて〜！」',zone:'hotel',discover:'rest'},
   {face:'👨',name:'村の人',say:'「相談があります」',zone:'office',discover:'admin'},
   {face:'🧭',name:'道を聞く人',say:'「北へ行く道は？」',zone:'guide',discover:'guide'},
   {face:'📦',name:'荷物を運ぶ人',say:'「ここに置ける？」',zone:'store',discover:'store'},
   {face:'✉️',name:'手紙を持った人',say:'「役人に届けたい」',zone:'office',discover:'admin'},
   {face:'🥾',name:'もう一人の旅人',say:'「少し休ませて」',zone:'hotel',discover:'rest'}
  ],
  clear:'宿・行政・道案内・荷物。いろいろな仕事が一つの場所に集まっていた！'}
];
const allDiscoveries=[
 ['rest','喜名番所は旅人が休む宿場の役わりもあった'],
 ['store','旅人や往来する人の荷物を扱う場所として考えられる'],
 ['admin','喜名番所は村の行政の仕事をする場所だった'],
 ['guide','首里から中頭・国頭へ向かう道の要所だった'],
 ['hub','喜名番所には、旅・行政・交通・交流の役わりが重なっていた']
];
let day=0,reputation=100,timeLeft=100,totalServed=0,served=0,selected=null,timer=null,muted=false,audio=null;
const discoveries=new Set();
const $=s=>document.querySelector(s),queue=$('#queue'),status=$('#status'),flash=$('#flash');

function tone(f=440,d=.05,g=.02){if(muted)return;if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(!audio)return;if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.value=f;a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(g,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(audio.destination);o.start();o.stop(t+d+.02)}
function addDiscovery(id){if(!discoveries.has(id)){discoveries.add(id);$('#collection').textContent='🔎 '+discoveries.size;tone(740,.05,.02)}}
function flashMsg(t,good=true){flash.textContent=(good?'✨ ':'💥 ')+t;flash.classList.add('show');clearTimeout(flashMsg.t);flashMsg.t=setTimeout(()=>flash.classList.remove('show'),850);tone(good?650:170,.08,.025)}
function updateHud(){reputation=Math.max(0,Math.min(100,reputation));timeLeft=Math.max(0,Math.min(100,timeLeft));$('#rep').textContent='⭐ '+reputation;$('#repBar').style.width=reputation+'%';$('#timeBar').style.width=timeLeft+'%'}
function renderDay(){
 clearInterval(timer);selected=null;served=0;timeLeft=100;
 const d=days[day];$('#dayLabel').textContent=(day+1)+'日目';$('#missionNo').textContent=(day+1)+'日目';$('#missionTitle').textContent=d.title;$('#missionText').textContent=d.text;queue.innerHTML='';
 d.guests.forEach((g,i)=>{const el=document.createElement('button');el.className='guest'+(i===0?' waiting':'');el.dataset.index=i;el.innerHTML='<div class="face">'+g.face+'</div><div><b>'+g.name+'</b><p>'+g.say+'</p></div>';el.onclick=()=>selectGuest(el,i);queue.appendChild(el)});
 status.textContent='お客さんを選ぼう。';document.querySelectorAll('.zone').forEach(z=>z.classList.remove('hit','bad'));updateHud();
 timer=setInterval(()=>{timeLeft-=1.2;if(timeLeft<=0){clearInterval(timer);reputation-=10;updateHud();flashMsg('時間切れ！ 評判が下がった',false);setTimeout(()=>endDay(),650)}else updateHud()},700)
}
function selectGuest(el,i){
 if(el.classList.contains('done'))return;queue.querySelectorAll('.guest').forEach(g=>g.classList.remove('selected'));el.classList.add('selected');selected=i;
 const g=days[day].guests[i];status.textContent=g.face+' '+g.name+'：'+g.say+' → どこへ案内する？'
}
function sendTo(zone){
 if(selected===null){flashMsg('先にお客さんを選ぼう！',false);return}
 const g=days[day].guests[selected],el=queue.querySelector('[data-index="'+selected+'"]');
 document.querySelectorAll('.zone').forEach(z=>z.classList.remove('hit','bad'));
 const target=document.querySelector('.zone[data-zone="'+zone+'"]');
 if(zone===g.zone){
   target.classList.add('hit');el.classList.remove('selected','waiting');el.classList.add('done');served++;totalServed++;reputation=Math.min(100,reputation+3);timeLeft=Math.min(100,timeLeft+7);addDiscovery(g.discover);flashMsg('ありがとう！ ぴったりの対応！',true);
   selected=null;const next=[...queue.querySelectorAll('.guest:not(.done)')][0];if(next)next.classList.add('waiting');status.textContent='次のお客さんを選ぼう。';updateHud();
   if(served>=days[day].guests.length){addDiscovery('hub');setTimeout(()=>endDay(),650)}
 }else{
   target.classList.add('bad');reputation-=8;timeLeft-=6;flashMsg('ちがうみたい！ 困りごとをもう一度見よう',false);updateHud()
 }
}
function endDay(){
 clearInterval(timer);const d=days[day];$('#dayEmoji').textContent=d.emoji;$('#dayTitle').textContent=(day+1)+'日目クリア！';$('#dayText').textContent=d.clear;$('#dayRep').textContent=reputation;$('#dayServed').textContent=served;$('#dayClear').classList.add('show')
}
function showCollection(){const ul=$('#discoverList');ul.innerHTML='';allDiscoveries.forEach(([id,t])=>{const li=document.createElement('li');li.className=discoveries.has(id)?'':'locked';li.textContent=(discoveries.has(id)?'✅ ':'🔒 ')+t;ul.appendChild(li)});$('#collectionOverlay').classList.add('show')}
document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>sendTo(b.dataset.zone));
$('#start').onclick=()=>{$('#title').classList.remove('active');$('#game').classList.add('active');renderDay()};
$('#nextDay').onclick=()=>{$('#dayClear').classList.remove('show');if(day<3){day++;renderDay()}else{$('#finalRep').textContent=reputation;$('#finalServed').textContent=totalServed;$('#finishText').textContent='喜名番所は、旅人を休ませるだけでなく、村の仕事・道案内・人や荷物の行き来を支える場所だった！';$('#finish').classList.add('show')}};
$('#retry').onclick=()=>{$('#finish').classList.remove('show');day=0;reputation=100;timeLeft=100;totalServed=0;discoveries.clear();$('#collection').textContent='🔎 0';renderDay()};
$('#collection').onclick=showCollection;$('#showCollection').onclick=showCollection;$('#closeCollection').onclick=()=>$('#collectionOverlay').classList.remove('show');
$('#mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊'};
})();
</script>
</body>
</html>

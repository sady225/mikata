# Copy to wrangler.toml only in a dedicated test project; review before deploy.
name = "denchi-seminar-access-prototype"
main = "src/worker.mjs"
compatibility_date = "2026-11-11"
workers_dev = false

[[r2_buckets]]
binding = "PRIVATE_MATERIALS"
bucket_name = "REPLACE_WITH_PRIVATE_R2_BUCKET"

[[ratelimits]]
name = "LOGIN_LIMITER"
# Choose a positive integer that is unique within the Cloudflare account.
namespace_id = "REPLACE_WITH_UNIQUE_POSITIVE_INTEGER"

  [ratelimits.simple]
  limit = 5
  period = 60
